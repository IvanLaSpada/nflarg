async function tabStats(r, lg, season, ctx){
  const urls = [];
  if(lg.group) urls.push(`${CORE}/${lg.slug}/seasons/${season}/types/2/groups/${lg.group}/leaders`);
  urls.push(`${CORE}/${lg.slug}/seasons/${season}/types/2/leaders`);
  let d = null, lastErr = null;
  for(const u of urls){
    try{ const x = await API.get(u); if(arr(x.categories).length){ d = x; break; } }catch(e){ lastErr = e; }
  }
  if(!d){ if(lastErr && lastErr.status !== 404) throw lastErr; return emptyBox('Sin estadísticas', 'ESPN no tiene líderes cargados para esta temporada.'); }
  const cats = arr(d.categories).filter(c => arr(c.leaders).length).map(c => ({
    name: c.name, title: CAT_ES[c.name] || c.displayName || c.name, abbr: c.abbreviation || c.shortDisplayName || '',
    leaders: arr(c.leaders).slice(0, 10),
  }));
  cats.sort((a, b) => { const ia = CAT_ORDER.indexOf(a.name), ib = CAT_ORDER.indexOf(b.name); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  // Resolver referencias $ref de atletas (deduplicadas) y equipos (vía lista de equipos)
  const refs = [...new Set(cats.flatMap(c => c.leaders.map(l => (l.athlete?.$ref || '').replace(/^http:/, 'https:')).filter(Boolean)))];
  await teamsOf(lg).catch(() => {});
  const aths = await pool(refs, 10, u => API.get(u, {ttl: LONG_TTL}));
  const athMap = Object.fromEntries(refs.map((u, i) => [u, aths[i]]));
  const teamRefs = [...new Set(cats.flatMap(c => c.leaders.map(l => l.team?.$ref).filter(Boolean)))].filter(u => !lg.teamIdx?.[idOf(u, 'teams')]);
  const tms = await pool(teamRefs, 6, u => API.get(u, {ttl: LONG_TTL}));
  const extraTeams = Object.fromEntries(teamRefs.map((u, i) => [idOf(u, 'teams'), tms[i]]));
  const cards = cats.map(c => {
    const rows = c.leaders.map((l, i) => {
      const aref = (l.athlete?.$ref || '').replace(/^http:/, 'https:');
      const a = athMap[aref] || l.athlete || {};
      const aid = a.id || idOf(aref, 'athletes');
      const tid = idOf(l.team?.$ref, 'teams') || a.team?.id || idOf(a.team?.$ref, 'teams');
      const t = (tid && (lg.teamIdx?.[tid] || extraTeams[tid])) || {};
      const nm = a.displayName || a.fullName || a.shortName || 'Jugador #' + (aid || '?');
      return `<div class="ldr ${i === 0 ? 'top' : ''}"><span class="n">${i + 1}</span>${headshot(a.headshot?.href, 'hs', nm)}
        <div class="who">${aid ? `<a href="#/${lg.key}/player/${aid}">${esc(nm)}</a>` : `<b>${esc(nm)}</b>`}<small>${t.id ? logo(t) + esc(tAbbr(t)) : ''}${a.position?.abbreviation ? ' · ' + esc(a.position.abbreviation) : ''}</small></div>
        <span class="v">${esc(l.displayValue ?? l.value ?? '-')}</span></div>`;
    }).join('');
    return `<div><div class="ph">${esc(c.title)} ${c.abbr ? `<span class="cnt">(${esc(c.abbr)})</span>` : ''}</div><div class="box">${rows}</div></div>`;
  }).join('');
  return `<div class="legend">Top 10 por categoría · temporada regular ${season}</div><div class="grid3">${cards}</div>`;
}

/* ---------- Partido (detalle) ---------- */
const BOX_ES = {passing: 'Pases', rushing: 'Carreras', receiving: 'Recepciones', fumbles: 'Fumbles', defensive: 'Defensa', interceptions: 'Intercepciones', kickReturns: 'Devoluciones de kickoff', puntReturns: 'Devoluciones de punt', kicking: 'Pateo', punting: 'Punts'};
function numVal(s){
  s = String(s ?? '');
  if(/^\d+:\d{2}$/.test(s)){ const [m, x] = s.split(':').map(Number); return m * 60 + x; }
  const f = parseFloat(s.split(/[-\/]/)[0]);
  return isNaN(f) ? NaN : f;
}
VIEWS.game = async (r, el, ctx) => {
  const lg = LG[r.lg];
  if(!ctx.silent) paint(ctx, el, spinner('Cargando partido'));
  const d = await API.get(`${SITE}/${lg.slug}/summary?event=${encodeURIComponent(r.id)}`);
  if(!alive(ctx)) return;
  const hc = arr(d.header?.competitions)[0] || {};
  const g = normGame({id: r.id, competitions: [hc], date: hc.date, week: d.header?.week, seasonType: d.header?.season}, r.lg);
  if(!g.home.id && !g.away.id) throw new ApiError('ESPN no devolvió datos para este partido.', 404, '');
  g.situation = d.situation || hc.situation || g.situation;
  if(g.situation?.possession != null){ const p = String(g.situation.possession); g.away.possession = p === g.away.id; g.home.possession = p === g.home.id; }
  if(g.state !== 'in'){ g.away.possession = g.home.possession = false; }
  if(!g.tv) g.tv = getTV({broadcasts: d.broadcasts}) || '';
  state.liveInView = g.state === 'in' || isSoon(g);
  const s = statusInfo(g);
  const A = g.away, H = g.home;
  const season = num(d.header?.season?.year) || curSeason(lg);
  const tlink = (c) => c.id ? `#/${lg.key}/team/${c.id}/plantel/${season}` : '#';
  const side = (c) => `<div class="side">${logo(c.team)}<a href="${tlink(c)}">${c.rank ? '#' + c.rank + ' ' : ''}${esc(c.team.displayName || tName(c.team))}</a><small>${esc(c.record || '')}</small>${c.possession ? '<span class="poss"><span class="ball"></span> Posesión</span>' : ''}</div>`;
  const pre = g.state === 'pre';
  const venue = d.gameInfo?.venue || hc.venue || {};
  const vtxt = [venue.fullName, [venue.address?.city, venue.address?.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
  const stTxt = pre ? (s.k === 'ppd' ? s.txt : `${fmtLong(g.date)} · ${s.txt}`) : s.txt;
  let html = `<div class="crumb"><a href="#/hoy">Hoy</a> › <a href="#/${lg.key}/partidos">${esc(lg.name)}</a> › ${esc(tAbbr(A.team))} @ ${esc(tAbbr(H.team))}</div>
    <div class="gh" style="--ca:${teamColor(A.team)};--ch:${teamColor(H.team)}">
      ${side(A)}
      <div class="mid">
        ${pre ? `<div class="ledrow"><span class="led" style="font-size:30px">@</span></div>` : `<div class="ledrow"><span class="led ${H.win ? 'lose' : ''}">${esc(A.score ?? '0')}</span><span class="led ${A.win ? 'lose' : ''}">${esc(H.score ?? '0')}</span></div>`}
        <div class="stat">${g.state === 'in' ? '<span class="live">EN VIVO</span> ' : ''}${esc(stTxt)}</div>
        <div class="info">${esc(g.tv ? '📺 ' + g.tv : '')}${g.tv && vtxt ? '<br>' : ''}${esc(vtxt)}</div>
      </div>
      ${side(H)}
    </div>`;
  if(g.state === 'in' && g.situation){
    const si = g.situation;
    const pt = A.possession ? A.team : H.possession ? H.team : null;
    html += `<div class="sitbar">${pt ? `<span class="ball"></span><b>${esc(tName(pt))}</b>` : ''}${si.downDistanceText ? `<span class="dd">${esc(si.downDistanceText)}</span>` : ''}${si.isRedZone ? '<span class="rz">ZONA ROJA</span>' : ''}${si.lastPlay?.text ? `<span class="lp">Última jugada: ${esc(si.lastPlay.text)}</span>` : ''}</div>`;
  }
  if(g.note || arr(hc.notes)[0]?.headline) html += `<div class="legend" style="text-align:center">${esc(g.note || hc.notes[0].headline)}</div>`;

  // Marcador por cuarto
  const nq = Math.max(4, A.lines.length, H.lines.length);
  if(!pre && (A.lines.length || H.lines.length)){
    const ths = Array.from({length: nq}, (_, i) => `<th>${i < 4 ? 'Q' + (i + 1) : (i === 4 ? 'OT' : (i - 3) + 'OT')}</th>`).join('');
    const tr = c => `<tr><td class="l"><span class="tmc">${logo(c.team)} <b>${esc(tAbbr(c.team))}</b></span></td>${Array.from({length: nq}, (_, i) => `<td>${esc(c.lines[i] ?? '-')}</td>`).join('')}<td class="t">${esc(c.score ?? '-')}</td></tr>`;
    html += `<div class="star-sep"><span>Marcador</span></div><div class="box tw" style="border-top:1px solid #9aa7bd"><table class="tbl ls"><thead><tr><th class="l">Equipo</th>${ths}<th class="t">T</th></tr></thead><tbody>${tr(A)}${tr(H)}</tbody></table></div>`;
  }

  // Líderes del partido
  const L = arr(d.leaders);
  if(L.length){
    const findTeam = c => L.find(x => String(x.team?.id) === c.id) || null;
    const la = findTeam(A) || L[0], lh = findTeam(H) || L[1];
    const want = ['passingYards', 'rushingYards', 'receivingYards'];
    const catsA = arr(la?.leaders), catsH = arr(lh?.leaders);
    let names = want.filter(n => catsA.some(c => c.name === n) || catsH.some(c => c.name === n));
    if(!names.length) names = [...new Set(catsA.concat(catsH).map(c => c.name))].slice(0, 3);
    const cell = (cats, n, t) => {
      const c = cats.find(x => x.name === n); const l = arr(c?.leaders)[0];
      if(!l) return '<div><span class="who" style="color:#999">—</span></div>';
      const a = l.athlete || {};
      return `<div>${headshot(a.headshot?.href, 'hs', a.displayName)}<div class="who">${a.id ? `<a href="#/${lg.key}/player/${a.id}">${esc(a.displayName || a.shortName)}</a>` : esc(a.displayName || '')} <small style="color:#888">${esc(a.position?.abbreviation || '')} · ${esc(tAbbr(t))}</small><span>${esc(l.displayValue || '')}</span></div></div>`;
    };
    const titles = {passingYards: 'Pases', rushingYards: 'Carreras', receivingYards: 'Recepciones'};
    const rows = names.map(n => {
      const c = catsA.concat(catsH).find(x => x.name === n);
      return `<div class="gl"><div class="cat">${esc(titles[n] || c?.displayName || n)}</div>${cell(catsA, n, A.team)}${cell(catsH, n, H.team)}</div>`;
    }).join('');
    if(rows) html += `<div class="star-sep"><span>Líderes${pre ? ' de la temporada' : ' del partido'}</span></div><div class="box" style="border-top:1px solid #9aa7bd">${rows}</div>`;
  }

  // Jugadas de anotación
  const SP = arr(d.scoringPlays);
  if(SP.length){
    let last = null, rows = '';
    for(const p of SP){
      const q = num(p.period?.number);
      if(q !== last){ rows += `<div class="dayh">${q <= 4 ? q + 'º cuarto' : 'Tiempo extra'}</div>`; last = q; }
      const ab = (p.scoringType?.abbreviation || p.type?.abbreviation || '').toUpperCase();
      const tm = p.team || {};
      const t = (String(tm.id) === A.id ? A.team : String(tm.id) === H.id ? H.team : tm);
      rows += `<div class="sp-row"><span class="sp-q">${esc(p.clock?.displayValue || '')}</span><span class="sp-type ${esc(ab)}">${esc(ab || '•')}</span><span class="tmc" style="display:flex;gap:6px;align-items:center">${logo(t)}<span>${esc(p.text || '')}</span></span><span class="sp-sc">${esc(p.awayScore ?? '')}-${esc(p.homeScore ?? '')}</span></div>`;
    }
    html += `<div class="star-sep"><span>Jugadas de anotación</span></div><div class="box" style="border-top:1px solid #9aa7bd">${rows}</div>`;
  }

  // Box score por equipo (estadísticas de equipo)
  const BT = arr(d.boxscore?.teams);
  if(BT.length >= 2 && BT.some(t => arr(t.statistics).length)){
    const ba = BT.find(t => String(t.team?.id) === A.id) || BT[0], bh = BT.find(t => String(t.team?.id) === H.id) || BT[1];
    const statsH = arr(bh.statistics);
    const rows = arr(ba.statistics).map(sa => {
      const sh = statsH.find(x => x.name === sa.name) || {};
      const va = numVal(sa.displayValue), vh = numVal(sh.displayValue);
      const lowerBetter = /turnover|penalt|fumblesLost|interceptions|sacksYardsLost/i.test(sa.name || '');
      const tot = va + vh;
      const bar = (!isNaN(tot) && tot > 0) ? `<div class="bars"><i style="width:${(va / tot * 100).toFixed(1)}%;background:${teamColor(A.team)}"></i><i style="width:${(vh / tot * 100).toFixed(1)}%;background:${teamColor(H.team)}"></i></div>` : '';
      const bA = !lowerBetter ? va > vh : va < vh, bH = !lowerBetter ? vh > va : vh < va;
      return `<div class="cmp"><span class="v" style="${bA ? 'color:var(--navy)' : 'color:#777'}">${esc(sa.displayValue ?? '-')}</span><div class="lb">${esc(sa.label || sa.name)}${bar}</div><span class="v" style="${bH ? 'color:var(--navy)' : 'color:#777'}">${esc(sh.displayValue ?? '-')}</span></div>`;
    }).join('');
    html += `<div class="star-sep"><span>Estadísticas de equipo</span></div><div class="ph sm" style="justify-content:space-between"><span class="tmc" style="display:flex;gap:6px;align-items:center">${logo(A.team)} ${esc(tAbbr(A.team))}</span><span class="tmc" style="display:flex;gap:6px;align-items:center">${esc(tAbbr(H.team))} ${logo(H.team)}</span></div><div class="box">${rows}</div>`;
  }

  // Box score individual
  const BP = arr(d.boxscore?.players);
  if(BP.length){
    const pa = BP.find(p => String(p.team?.id) === A.id) || BP[0], ph = BP.find(p => String(p.team?.id) === H.id) || BP[1];
    const order = [...new Set(arr(pa?.statistics).concat(arr(ph?.statistics)).map(c => c.name))];
    const tbl = (P, c) => {
      const cat = arr(P?.statistics).find(x => x.name === c);
      if(!cat || !arr(cat.athletes).length) return '';
      const t = P.team || {};
      const labels = arr(cat.labels);
      const rows = arr(cat.athletes).map(a => `<tr><td class="l">${a.athlete?.id ? `<a href="#/${lg.key}/player/${a.athlete.id}">${esc(a.athlete.displayName || a.athlete.shortName)}</a>` : esc(a.athlete?.displayName || '')}</td>${arr(a.stats).map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('');
      const tot = arr(cat.totals).length ? `<tr class="tot"><td class="l">Total</td>${arr(cat.totals).map(x => `<td>${esc(x)}</td>`).join('')}</tr>` : '';
      return `<div><div class="bx-team" style="--tc:${teamColor(t)}">${logo(t)} ${esc(t.displayName || tName(t))}</div><div class="tw"><table class="tbl"><thead><tr><th class="l">Jugador</th>${labels.map(x => `<th title="${esc(x)}">${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows}${tot}</tbody></table></div></div>`;
    };
    const sects = order.map(c => {
      const a = tbl(pa, c), h = tbl(ph, c);
      if(!a && !h) return '';
      return `<div class="sect"><div class="ph">${esc(BOX_ES[c] || c)}</div><div class="box"><div class="boxgrid">${a}${h}</div></div></div>`;
    }).join('');
    if(sects) html += `<div class="star-sep"><span>Box score</span></div>${sects}`;
  }

  // Info del partido
  const gi = d.gameInfo || {};
  const odds = arr(d.pickcenter)[0] || arr(hc.odds)[0];
  const kv = [];
  if(vtxt) kv.push(['Estadio', vtxt]);
  kv.push(['Fecha', `${fmtLong(g.date)} · ${fmtTime(g.date)}`]);
  if(g.tv) kv.push(['TV', g.tv]);
  if(gi.attendance) kv.push(['Asistencia', Number(gi.attendance).toLocaleString('es-AR')]);
  if(gi.weather) kv.push(['Clima', [gi.weather.displayValue, gi.weather.temperature != null ? gi.weather.temperature + '°F (' + Math.round((gi.weather.temperature - 32) * 5 / 9) + '°C)' : ''].filter(Boolean).join(' · ')]);
  if(odds?.details) kv.push(['Línea', odds.details + (odds.overUnder ? ` · O/U ${odds.overUnder}` : '')]);
  if(pre && !L.length && !SP.length) html += emptyBox('El partido todavía no comenzó', 'Las estadísticas aparecerán cuando arranque.');
  html += `<div class="star-sep"><span>Info</span></div><div class="box" style="border-top:1px solid #9aa7bd"><dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`;
  paint(ctx, el, html);
};

/* ---------- Equipo ---------- */
const POS_SIDE = {
  offense: ['QB', 'RB', 'FB', 'HB', 'WR', 'TE', 'OL', 'OT', 'OG', 'T', 'G', 'C', 'SB'],
  defense: ['DL', 'DE', 'DT', 'NT', 'LB', 'ILB', 'OLB', 'MLB', 'DB', 'CB', 'S', 'FS', 'SS', 'EDGE', 'DS'],
  specialTeam: ['K', 'P', 'LS', 'PK', 'KR', 'PR'],
};
const SIDE_ES = {offense: 'Ofensiva', defense: 'Defensiva', specialTeam: 'Equipos especiales', specialteam: 'Equipos especiales', injuredReserveOrOut: 'Lesionados / Reserva', practiceSquad: 'Practice squad', suspended: 'Suspendidos', other: 'Otros'};
const POS_ORDER = [].concat(POS_SIDE.offense, POS_SIDE.defense, POS_SIDE.specialTeam);
function sideOf(pos){ for(const [k, v] of Object.entries(POS_SIDE)) if(v.includes(pos)) return k; return 'other'; }
const metricH = a => a?.height ? ` <small style="color:#888">(${(a.height * 0.0254).toFixed(2)} m)</small>` : '';
const metricW = a => a?.weight ? ` <small style="color:#888">(${Math.round(a.weight * 0.4536)} kg)</small>` : '';

VIEWS.team = async (r, el, ctx) => {
  const lg = LG[r.lg];
  const season = r.season || state.season || curSeason(lg);
  if(!ctx.silent) paint(ctx, el, spinner('Cargando equipo'));
  let t = {};
  try{ const td = await API.get(`${SITE}/${lg.slug}/teams/${encodeURIComponent(r.id)}`); t = td.team || {}; }
  catch(e){ await teamsOf(lg).catch(() => {}); t = lg.teamIdx?.[r.id]; if(!t) throw e; }
  if(!alive(ctx)) return;
  let rec = '', pos = '';
  const isCur = season === curSeason(lg);
  if(isCur){
    const items = arr(t.record?.items);
    rec = (items.find(i => i.type === 'total') || items[0])?.summary || '';
    pos = ordinalEs(t.standingSummary || '');
  }
  try{
    const groups = await standingsOf(lg, season, lg.college ? 'conf' : 'div');
    const gr = groups.find(x => x.entries.some(e => String(e.team?.id) === String(r.id)));
    if(gr){
      const sorted = sortEntries(gr.entries, lg);
      const i = sorted.findIndex(e => String(e.team?.id) === String(r.id));
      const e = sorted[i];
      if(!rec){ const w = sv(e, 'wins'), l = sv(e, 'losses'), ti = sn(e, 'ties'); if(w != null && l != null) rec = `${w}-${l}${ti > 0 ? '-' + ti : ''}`; }
      if(!pos) pos = `${i + 1}º en ${gr.name}`;
    }
  }catch(e){}
  const c1 = teamColor(t);
  const tabs = [['plantel', 'Plantel'], ['fixture', 'Fixture / Resultados'], ['stats', 'Estadísticas']];
  const head = `<div class="crumb"><a href="#/${lg.key}/partidos">${esc(lg.name)}</a> › <a href="#/${lg.key}/posiciones/${season}">Posiciones</a> › ${esc(t.displayName || '')}</div>
    <div class="hero" style="--tc:${c1}">
      ${teamLogo(t) ? `<img class="wm" src="${esc(teamLogo(t))}" alt="" onerror="this.remove()">` : ''}
      ${logo(t, 'big')}
      <div style="position:relative;z-index:1;min-width:0"><h1>${esc(t.displayName || tName(t) || 'Equipo')}</h1>
        <div class="meta"><span class="chip gold">★ ${season}</span>${rec ? `<span class="chip">Récord ${esc(rec)}</span>` : ''}${pos ? `<span class="chip dark">${esc(pos)}</span>` : ''}</div>
      </div>
    </div>
    <div class="tabs">${tabs.map(([k, n]) => `<a class="tab ${k === r.tab ? 'on' : ''}" href="#/${lg.key}/team/${r.id}/${k}/${season}">${n}</a>`).join('')}</div>`;
  if(!ctx.silent) paint(ctx, el, head + spinner());
  let body;
  try{
    if(r.tab === 'plantel') body = await teamRoster(lg, r.id, season, isCur);
    else if(r.tab === 'fixture') body = await teamFixture(lg, r.id, season, ctx);
    else body = await teamStats(lg, r.id, season, isCur);
  }catch(e){ console.error(e); body = errorBox(e); }
  paint(ctx, el, head + body);
};

async function teamRoster(lg, id, season, isCur){
  let d;
  try{ d = await API.get(`${SITE}/${lg.slug}/teams/${id}/roster${isCur ? '' : '?season=' + season}`); }
  catch(e){ if(isCur) throw e; d = null; }
  let groups = arr(d?.athletes);
  let note = '';
  if(!groups.length && !isCur){
    note = `<div class="legend">ESPN no tiene el plantel de ${season}; se muestra el plantel actual.</div>`;
    d = await API.get(`${SITE}/${lg.slug}/teams/${id}/roster`);
    groups = arr(d?.athletes);
  }
  if(groups.length && !groups[0].items){
    const b = {};
    groups.forEach(a => { const k = sideOf(a.position?.abbreviation); (b[k] = b[k] || []).push(a); });
    groups = ['offense', 'defense', 'specialTeam', 'other'].filter(k => b[k]).map(k => ({position: k, items: b[k]}));
  }
  if(!groups.length) return emptyBox('Sin plantel', 'ESPN no devolvió jugadores para este equipo.');
  const coach = arr(d?.coach)[0];
  const sorter = (a, b) => { const pa = POS_ORDER.indexOf(a.position?.abbreviation), pb = POS_ORDER.indexOf(b.position?.abbreviation); return ((pa < 0 ? 99 : pa) - (pb < 0 ? 99 : pb)) || ((num(a.jersey) ?? 999) - (num(b.jersey) ?? 999)); };
  let html = note + (coach ? `<div class="legend" style="font-size:12px">Head coach: <b>${esc([coach.firstName, coach.lastName].filter(Boolean).join(' '))}</b>${coach.experience != null ? ` · ${coach.experience} años de experiencia` : ''}</div>` : '');
  for(const gr of groups){
    const items = arr(gr.items).slice().sort(sorter);
    if(!items.length) continue;
    const rows = items.map(a => `<tr><td><b>${esc(a.jersey ?? '-')}</b></td>
      <td class="l"><a class="tmc" href="#/${lg.key}/player/${a.id}">${headshot(a.headshot?.href, 'hs', a.displayName)}<span>${esc(a.displayName || a.fullName || '')}</span></a></td>
      <td><b>${esc(a.position?.abbreviation || '-')}</b></td><td>${esc(a.age ?? '-')}</td>
      <td>${esc(a.displayHeight || '-')}${metricH(a)}</td><td>${esc(a.displayWeight || '-')}${metricW(a)}</td>
      <td class="hm">${esc(a.experience?.years != null ? (a.experience.years === 0 ? 'R' : a.experience.years) : '-')}</td>
      <td class="l">${esc(a.college?.name || a.college?.shortName || '-')}</td></tr>`).join('');
    html += `<div class="sect"><div class="ph">${esc(SIDE_ES[gr.position] || cap(String(gr.position || 'Otros')))} <span class="cnt">· ${items.length} jugadores</span></div><div class="box tw roster"><table class="tbl"><thead><tr><th>#</th><th class="l">Jugador</th><th>Pos</th><th>Edad</th><th>Altura</th><th>Peso</th><th class="hm">Exp</th><th class="l">College</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  return html;
}

async function teamFixture(lg, id, season, ctx){
  const res = await Promise.all([1, 2, 3].map(t => API.get(`${SITE}/${lg.slug}/teams/${id}/schedule?season=${season}&seasontype=${t}`).then(d => ({t, d}), () => ({t, d: null}))));
  if(res.every(x => !x.d)) throw new ApiError('No se pudo cargar el calendario del equipo.', 0, '');
  const seen = new Set();
  const byType = {};
  let bye = null;
  for(const {t, d} of res){
    if(!d) continue;
    if(t === 2 && d.byeWeek) bye = num(d.byeWeek);
    for(const ev of arr(d.events)){
      if(seen.has(ev.id)) continue; seen.add(ev.id);
      const g = normGame(ev, lg.key);
      const tt = g.stype || t;
      (byType[tt] = byType[tt] || []).push({g, ev});
    }
  }
  const types = Object.keys(byType).map(Number).sort();
  if(!types.length) return emptyBox('Sin partidos', `ESPN no devolvió partidos para ${season}.`);
  let live = false, html = '';
  for(const t of types){
    const list = byType[t].sort((a, b) => a.g.date - b.g.date);
    let rows = '', byeDone = false;
    for(const {g, ev} of list){
      if(g.state === 'in' || isSoon(g)) live = true;
      const wk = num(ev.week?.number);
      if(t === 2 && bye && !byeDone && wk && wk > bye){ rows += `<tr class="bye"><td>${bye}</td><td colspan="5" class="l">Semana libre (BYE)</td></tr>`; byeDone = true; }
      const me = g.home.id === String(id) ? g.home : g.away;
      const op = me === g.home ? g.away : g.home;
      const at = me === g.home ? 'vs' : '@';
      let result;
      if(g.state === 'post'){
        const ms = parseFloat(me.score), os = parseFloat(op.score);
        const R = me.win ? 'W' : op.win ? 'L' : (ms > os ? 'W' : ms < os ? 'L' : 'T');
        result = `<span class="res ${R}">${R === 'W' ? 'G' : R === 'L' ? 'P' : 'E'}</span><b>${esc(me.score ?? '-')}-${esc(op.score ?? '-')}</b>${g.period > 4 ? ' OT' : ''}`;
      } else {
        const s = statusInfo(g);
        result = g.state === 'in' ? `<span class="live">EN VIVO</span> <b>${esc(me.score ?? 0)}-${esc(op.score ?? 0)}</b>` : esc(s.txt);
      }
      const wlabel = ev.week?.text ? weekLabel(ev.week.text) : (wk ? wk : '-');
      rows += `<tr onclick="location.hash='#/${lg.key}/game/${esc(g.id)}'" style="cursor:pointer"><td>${esc(wlabel)}</td><td class="l">${esc(fmtShort(g.date))}</td>
        <td class="l"><span class="tmc"><span style="color:#888;width:16px">${at}</span>${logo(op.team)}<a href="#/${lg.key}/game/${esc(g.id)}">${esc(op.team.displayName || tName(op.team))}</a></span></td>
        <td class="l">${result}</td><td class="hm">${esc(g.tv || '')}</td><td class="hm">${esc(me.record || '')}</td></tr>`;
    }
    html += `<div class="sect"><div class="ph">${esc(STYPE[t] || 'Partidos')} <span class="cnt">· ${list.length} partidos</span></div><div class="box tw"><table class="tbl"><thead><tr><th>Sem</th><th class="l">Fecha</th><th class="l">Rival</th><th class="l">Resultado</th><th class="hm">TV</th><th class="hm">Récord</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  if(alive(ctx)) state.liveInView = live;
  return html;
}

function findCats(d){
  const direct = d?.results?.stats?.categories || d?.statistics?.splits?.categories || d?.splits?.categories || d?.results?.categories || d?.statistics?.categories;
  if(arr(direct).length) return arr(direct);
  let found = null;
  (function walk(o, depth){
    if(found || !o || typeof o !== 'object' || depth > 6) return;
    if(Array.isArray(o.categories) && o.categories.some(c => arr(c?.stats).length)){ found = o.categories; return; }
    for(const k in o) walk(o[k], depth + 1);
  })(d, 0);
  return arr(found);
}
async function teamStats(lg, id, season, isCur){
  let d;
  try{ d = await API.get(`${SITE}/${lg.slug}/teams/${id}/statistics${isCur ? '' : '?season=' + season}`); }
  catch(e){ if(e.status === 404) return emptyBox('Sin estadísticas', 'ESPN no tiene estadísticas de este equipo para la temporada.'); throw e; }
  const cats = findCats(d).filter(c => arr(c.stats).length);
  if(!cats.length) return emptyBox('Sin estadísticas', 'ESPN no devolvió estadísticas para este equipo.');
  const cards = cats.map(c => {
    const hasRank = c.stats.some(s => s.rankDisplayValue);
    const hasPG = c.stats.some(s => s.perGameDisplayValue);
    const rows = c.stats.map(s => `<tr><td class="l" title="${esc(s.description || '')}">${esc(s.displayName || s.shortDisplayName || s.name)}</td><td><b>${esc(s.displayValue ?? s.value ?? '-')}</b></td>${hasPG ? `<td>${esc(s.perGameDisplayValue ?? '-')}</td>` : ''}${hasRank ? `<td>${esc(s.rankDisplayValue ?? '-')}</td>` : ''}</tr>`).join('');
    return `<div><div class="ph">${esc(BOX_ES[c.name] || c.displayName || c.name)}</div><div class="box tw"><table class="tbl"><thead><tr><th class="l">Estadística</th><th>Total</th>${hasPG ? '<th>x Partido</th>' : ''}${hasRank ? '<th>Rank</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('');
  return `<div class="grid2">${cards}</div>`;
}

  ].filter(x => x[1] != null && x[1] !== '');
  let html = `<div class="crumb"><a href="#/${lg.key}/partidos">${esc(lg.name)}</a>${t.id ? ` › <a href="#/${lg.key}/team/${t.id}">${esc(t.displayName || '')}</a>` : ''} › ${esc(name)}</div>
    <div class="hero pl-hero" style="--tc:${c1}">
      ${teamLogo(t) ? `<img class="wm" src="${esc(teamLogo(t))}" alt="" onerror="this.remove()">` : ''}
      ${headshot(a.headshot?.href, 'ph-img', name)}
      <div style="position:relative;z-index:1;min-width:0"><h1>${esc(name)}</h1>
        <div class="meta">${a.position?.abbreviation ? `<span class="chip gold">${esc(a.position.abbreviation)}</span>` : ''}${t.id ? `<a class="chip" href="#/${lg.key}/team/${t.id}">${logo(t)} ${esc(t.abbreviation || t.displayName)}</a>` : ''}${a.status?.name ? `<span class="chip dark">${esc(a.status.name)}</span>` : ''}</div>
      </div>
      ${a.jersey ? `<span class="num">#${esc(a.jersey)}</span>` : ''}
    </div>
    <div class="star-sep"><span>Ficha</span></div>
    <div class="box" style="border-top:1px solid #9aa7bd"><div class="bio">${bio.map(([k, v, raw]) => `<div><b>${esc(k)}</b>${raw ? v : esc(v)}</div>`).join('')}</div></div>`;
  const sum = arr(a.statsSummary?.statistics);
  if(sum.length) html += `<div class="ph">${esc(a.statsSummary.displayName || 'Resumen')}</div><div class="box"><div class="sumst">${sum.map(s => `<div><b>${esc(s.displayValue)}</b><small>${esc(s.shortDisplayName || s.abbreviation || s.displayName)}</small>${s.rankDisplayValue ? `<small style="display:block;font-weight:400">${esc(s.rankDisplayValue)}</small>` : ''}</div>`).join('')}</div></div>`;
  // Estadísticas por temporada
  const cats = arr(sd?.categories).filter(c => arr(c.statistics || c.stats).length);
  const teamsMap = sd?.teams || {};
  const teamAb = (id, slug) => { const x = Array.isArray(teamsMap) ? teamsMap.find(q => String(q.id) === String(id)) : teamsMap[id]; return x?.abbreviation || x?.displayName || (slug ? String(slug).toUpperCase().slice(0, 4) : ''); };
  if(cats.length){
    html += `<div class="star-sep"><span>Estadísticas por temporada</span></div>`;
    for(const c of cats){
      const labels = arr(c.labels).length ? c.labels : arr(c.names);

      html += `<div class="sect"><div class="ph">${esc(BOX_ES[c.name] || c.displayName || c.name)}</div><div class="box tw"><table class="tbl"><thead><tr><th class="l">Temp.</th><th class="l">Eq.</th>${labels.map((l, i) => `<th title="${esc(arr(c.displayNames)[i] || arr(c.descriptions)[i] || l)}">${esc(l)}</th>`).join('')}</tr></thead><tbody>${rows}${tot}</tbody></table></div></div>`;
    }
  } else {
    html += emptyBox('Sin estadísticas por temporada', 'ESPN no tiene estadísticas cargadas para este jugador.');
  }
  paint(ctx, el, html);
};

/* =========================================================================
   BUSCADOR (equipos locales + jugadores vía ESPN search)
   ========================================================================= */
const Search = {
  items: [], sel: -1,
  async run(q){
    const box = $('#qres');
    q = q.trim();
    if(q.length < 2){ box.classList.remove('on'); return; }
    box.innerHTML = spinner('', true); box.classList.add('on');
    const nq = norm(q);
    const teamsP = Promise.all(visible().map(lg => teamsOf(lg).then(ts => ts.map(t => ({lg, t})), () => []))).then(x => { const seen = new Set(); return x.flat().filter(({lg, t}) => { const k = lg.slug + ':' + t.id; if(seen.has(k)) return false; seen.add(k); return true; }); });
    const playersP = API.get(`${SEARCH}?query=${encodeURIComponent(q)}&limit=20`).then(parseSearch).catch(() => null);
    const [teams, players] = await Promise.all([teamsP, playersP]);
    if($('#q').value.trim() !== q) return;
    const tm = teams.filter(({t}) => [t.displayName, t.abbreviation, t.location, t.name, t.nickname, t.shortDisplayName].some(s => norm(s).includes(nq)))
      .sort((a, b) => (norm(a.t.displayName).startsWith(nq) ? 0 : 1) - (norm(b.t.displayName).startsWith(nq) ? 0 : 1) || LEAGUES.indexOf(a.lg) - LEAGUES.indexOf(b.lg))
      .slice(0, 8);
    this.items = [];
    let html = '';
    if(tm.length){
      html += '<div class="qr-h">Equipos</div>';
      html += tm.map(({lg, t}) => { this.items.push(`#/${lg.key}/team/${t.id}`); return `<a class="qr" href="#/${lg.key}/team/${t.id}">${logo(t)}<span>${esc(t.displayName)}<small>${esc(lg.name)}</small></span></a>`; }).join('');
    }
    if(players && players.length){
      html += '<div class="qr-h">Jugadores</div>';
      html += players.slice(0, 10).map(p => { this.items.push(`#/${p.lg}/player/${p.id}`); return `<a class="qr" href="#/${p.lg}/player/${p.id}">${headshot(p.img, 'hs', p.name)}<span>${esc(p.name)}<small>${esc(p.sub || LG[p.lg].name)}</small></span></a>`; }).join('');
    }
    if(!html) html = `<div class="qr-empty">Sin resultados para “${esc(q)}”.${players === null ? '<br>(La búsqueda de jugadores de ESPN no respondió.)' : ''}</div>`;
    else if(players === null) html += '<div class="qr-empty">La búsqueda de jugadores de ESPN no respondió.</div>';
    box.innerHTML = html; this.sel = -1;
  },
};
function parseSearch(d){
  const out = [], seen = new Set();
  const visit = x => {
    if(!x || typeof x !== 'object') return;
    if(Array.isArray(x)) return x.forEach(visit);
    const uid = String(x.uid || '');
    const web = String(x.link?.web || x.links?.web?.href || x.href || '');
    const m = uid.match(/~a:(\d+)/) || web.match(/\/player\/_\/id\/(\d+)/);
    const isFb = /^s:20~/.test(uid) || /\/(nfl|college-football|cfl|ufl)\//.test(web) || /football/i.test(x.sport || x.defaultLeagueSlug || '');
    if(m && isFb && (x.type ? /player|athlete/i.test(x.type) : true)){
      const id = m[1];
      let lg = 'nfl';
      if(/~l:23~/.test(uid) || /college-football/.test(web) || /college-football/.test(x.defaultLeagueSlug || '')) lg = 'fbs';
      else if(/\/cfl\//.test(web) || /cfl/.test(x.defaultLeagueSlug || '')) lg = 'cfl';
      else if(/\/ufl\//.test(web) || /ufl/.test(x.defaultLeagueSlug || '')) lg = 'ufl';
      if(!seen.has(lg + id) && LG[lg].ok !== false){ seen.add(lg + id); out.push({id, lg, name: x.displayName || x.name || x.title || 'Jugador', sub: x.subtitle || x.description || '', img: x.image?.default || x.image?.href || arr(x.images)[0]?.url || ''}); }
      return;
    }
    for(const k of ['results', 'contents', 'items', 'data']) if(x[k]) visit(x[k]);
  };
  visit(d);
  return out;
}

/* =========================================================================
   ACCIONES GLOBALES + ARRANQUE
   ========================================================================= */
window.App = {
  retry(){ if(!visible().length) state.readyP = null; route(); },
  sideRetry(){ state.sideKey = ''; renderSidebar(true); },
  setFilter(k){ state.filter = k; route(true); },
  setStand(m){ state.standMode = m; route(true); },
  pickDate(v, base){ if(/^\d{4}-\d{2}-\d{2}$/.test(v)) go(`${base}/${v.replace(/-/g, '')}`); },
  toggleBlk(k, h){
    const sec = h.closest('.blk'); sec.classList.toggle('closed');
    if(sec.classList.contains('closed')) state.collapsed.add(k); else state.collapsed.delete(k);
    try{ localStorage.setItem('nfa:collapsed', JSON.stringify([...state.collapsed])); }catch(e){}
  },
};

function init(){
  try{ $('#tzName').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || 'local'; }catch(e){ $('#tzName').textContent = 'local'; }
  window.addEventListener('hashchange', () => route());
  $('#burger').addEventListener('click', () => document.body.classList.toggle('menu'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('menu'));
  $('#seasonSel').addEventListener('change', e => onSeasonChange(e.target.value));
  const q = $('#q'), qres = $('#qres');
  const run = debounce(v => Search.run(v), 300);
  q.addEventListener('input', () => run(q.value));
  q.addEventListener('focus', () => { if(q.value.trim().length >= 2) qres.classList.add('on'); });
  q.addEventListener('blur', () => setTimeout(() => qres.classList.remove('on'), 200));
  q.addEventListener('keydown', e => {
    const links = [...qres.querySelectorAll('.qr')];
    if(e.key === 'Escape'){ qres.classList.remove('on'); q.blur(); }
    else if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); if(!links.length) return;
      Search.sel = (Search.sel + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
      links.forEach((l, i) => l.classList.toggle('sel', i === Search.sel));
    } else if(e.key === 'Enter'){
      const target = links[Search.sel >= 0 ? Search.sel : 0];
      if(target){ location.hash = target.getAttribute('href'); qres.classList.remove('on'); q.blur(); }
    }
  });
  qres.addEventListener('click', e => { if(e.target.closest('.qr')){ qres.classList.remove('on'); q.value = ''; } });

  // Auto-refresh cada 30s sólo si hay partidos en vivo en la vista actual
  setInterval(() => { if(state.liveInView && !document.hidden) route(true); }, 30e3);
  // Ticker: 30s si hay algo en vivo, si no cada 5 min
  let tick = 0;
  setInterval(() => {
    tick++;
    const anyLive = visible().some(lg => arr(lg.probe?.events).some(e => arr(e.competitions)[0]?.status?.type?.state === 'in'));
    if(!document.hidden && (anyLive || tick % 10 === 0)) refreshTicker();
  }, 30e3);
  route();
}
init();
