/* =========================================================================
   CUADRO DE PLAYOFFS (NFL, NCAA FBS y UFL)
   - Temporada terminada: el cuadro se arma desde la final hacia atrás con los partidos reales
     (sirve para cualquier formato y época; los equipos sin partido previo "descansaron").
   - Temporada en curso: NFL según los seeds de las posiciones de ESPN; FBS con el ranking CFP
     y las reglas de esa temporada (CFP_RULES). Los partidos ya jugados reemplazan a la proyección.
   ========================================================================= */
const BRACKET_LG = ['nfl', 'fbs', 'ufl'];
const BK_LEVELS = {
  nfl: ['Super Bowl', 'Final de conferencia', 'Divisional', 'Wild Card', 'Primera ronda'],
  fbs: ['Final', 'Semifinal', 'Cuartos de final', 'Primera ronda'],
  ufl: ['Final', 'Semifinal', 'Primera ronda'],
};
// Reglas del College Football Playoff por temporada (para proyectar el cuadro con el ranking CFP).
// 2026: 12 equipos. Entran los campeones de ACC, Big Ten, Big 12 y SEC, el mejor rankeado del Group of Six
// (American, Conference USA, MAC, Mountain West, Pac-12, Sun Belt) y Notre Dame si está en el top 12;
// el resto, por ranking. Seeds 1–12 por ranking (los clasificados automáticos fuera del top 12 van al fondo);
// del 1 al 4 descansan en primera ronda. Cuadro fijo: 1–8/9, 2–7/10, 3–6/11, 4–5/12; semis 1/4–... y 2/3.
const CFP_RULES = {
  2026: {teams: 12, p4: ['ACC', 'Big Ten', 'Big 12', 'SEC'], g6: /American|Conference USA|C-USA|Mid-American|\bMAC\b|Mountain West|Pac-12|Sun Belt/i, notreDame: '87'},
};
const BK_CFP_RE = /College Football Playoff|\bCFP\b/i;

async function postseasonEvents(lg, season){
  // Universitarios: "semana 1" de postemporada trae todos los bowls de esa temporada (por año calendario ESPN corta en 300 partidos)
  const urls = lg.group ? [sbUrl(lg, {dates: season, seasontype: 3, week: 1})] : [season, season + 1].map(y => sbUrl(lg, {dates: y, limit: 500}));
  const res = await Promise.all(urls.map(u => getSite(u).then(x => x, () => null)));
  if(res.every(x => !x)) throw new ApiError('No se pudo cargar la postemporada.', 0, urls[0]);
  const map = new Map();
  res.forEach(d => arr(d?.events).forEach(e => { if(num(e?.season?.year) === season && num(e?.season?.type) === 3 && e?.id) map.set(String(e.id), e); }));
  let games = [...map.values()].map(e => normGame(e, lg.key)).filter(g => !/POSTPONED|CANCEL/.test(g.statusName));
  if(lg.key === 'nfl') games = games.filter(g => !/pro bowl/i.test(g.note) && !['AFC', 'NFC'].includes(tAbbr(g.home.team)));
  return games.sort((a, b) => a.date - b.date);
}

/* Árbol desde la final: cada equipo viene del partido de playoff que ganó antes; si no tiene, descansó */
function bkTreeFromFinal(games, final){
  const used = new Set([final.id]);
  const node = (g, lvl) => {
    const sides = [g.away, g.home];
    const prev = sides.map(s => s.id ? games.filter(x => !used.has(x.id) && x.date < g.date && x.state === 'post' && [x.away, x.home].some(t => t.id === s.id && t.win)).sort((a, b) => b.date - a.date)[0] || null : null);
    prev.forEach(p => p && used.add(p.id));
    const kids = prev.some(Boolean) ? sides.map((s, i) => prev[i] ? node(prev[i], lvl + 1) : {team: s.team, id: s.id, lvl: lvl + 1}) : [];
    return {g, lvl, kids};
  };
  return node(final, 0);
}
function bkDepth(n){ return n.kids?.length ? 1 + Math.max(...n.kids.map(bkDepth)) : 0; }

/* Tarjeta de un partido (real o proyectado) */
function bkSide(s, seedOf, g, slot){
  const t = s?.team, id = s?.id || t?.id;
  if(!id || id === '-1') return `<div class="bk-t tbd"><i class="sd"></i><span></span><span class="nm">${esc(slot || 'Por definir')}</span><b></b></div>`;
  const sd = seedOf(String(id));
  const cls = g && g.state === 'post' ? (s.win ? 'w' : 'l') : '';
  const val = g && g.state !== 'pre' ? esc(s.score ?? '') : `<small>${esc(s.record || '')}</small>`;
  return `<div class="bk-t ${cls}"><i class="sd">${sd || ''}</i>${logo(t)}<span class="nm" title="${esc(tName(t))}">${esc(tAbbr(t))}</span><b>${val}</b></div>`;
}
function bkFoot(g){
  if(!g || g.virtual) return g?.foot || 'A jugarse';
  if(g.state === 'post') return /OT/i.test(g.detail) ? 'Final · alargue' : 'Final';
  if(g.state === 'in') return '● ' + (g.detail || 'En vivo');
  return g.timeValid === false ? fmtShort(g.date) : `${fmtShort(g.date)} · ${fmtTime(g.date)}`;
}
function bkCard(n, lgKey, seedOf, label){
  const g = n.g;
  const body = `<span class="bk-cap" title="${esc(label)}">${esc(label)}</span>${bkSide(g.away, seedOf, g, g.slots?.[0])}${bkSide(g.home, seedOf, g, g.slots?.[1])}<span class="bk-ft">${esc(bkFoot(g))}</span>`;
  return g.virtual || !g.id ? `<div class="bk-m virt">${body}</div>` : `<a class="bk-m st-${g.state}" href="#/${lgKey}/game/${esc(g.id)}">${body}</a>`;
}
function bkLeaf(n, seedOf, label){
  return `<div class="bk-m bye"><span class="bk-cap">${esc(label)}</span>${bkSide({team: n.team, id: n.id, record: n.record}, seedOf, null)}<span class="bk-ft">Descansa en esta ronda</span></div>`;
}
// Nodo recursivo: hijos a la izquierda, líneas y tarjeta; los nodos sin hijos se corren con un espaciador para alinear columnas
function bkNode(n, ctx, maxLvl){
  const pad = maxLvl - n.lvl;
  const sp = pad > 0 && !n.kids?.length ? `<div class="bk-sp" style="width:calc(${pad} * (var(--bw) + 2 * var(--bc)))"></div>` : '';
  const label = ctx.label(n);
  if(!n.g) return `<div class="bk-node">${sp}${bkLeaf(n, ctx.seedOf, label)}</div>`;
  const kids = n.kids?.length ? `<div class="bk-kids">${n.kids.map(k => bkNode(k, ctx, maxLvl)).join('')}</div><div class="bk-link"></div>` : '';
  return `<div class="bk-node">${sp}${kids}${bkCard(n, ctx.lg, ctx.seedOf, label)}${n.lvl === 0 ? ctx.champ(n) : ''}</div>`;
}
function bkRender(root, ctx){
  const maxLvl = bkDepth(root);
  return `<div class="bk-scroll"><div class="bk">${bkNode(root, ctx, maxLvl)}</div></div>`;
}
function bkChamp(n){
  const g = n.g;
  if(!g || g.state !== 'post') return '';
  const w = g.away.win ? g.away : g.home.win ? g.home : null;
  if(!w) return '';
  return `<div class="bk-link"></div><div class="bk-champ"><span>🏆 Campeón</span>${logo(w.team)}<b>${esc(tName(w.team))}</b></div>`;
}
// Etiqueta de cada tarjeta: conferencia o estadio del bowl + ronda
function bkLabelFn(lgKey, depth){
  const lv = BK_LEVELS[lgKey];
  return n => {
    const name = lv[Math.min(n.lvl, lv.length - 1)];
    const note = n.g?.note || '';
    const conf = n.conf || (/^\s*(AFC|NFC)\b/i.exec(note) || [])[1]?.toUpperCase() || '';
    if(lgKey === 'nfl'){
      if(n.lvl === 0) return note && /super bowl/i.test(note) ? note : 'Super Bowl';
      if(!conf && /AFL|NFL/.test(note)) return note.replace(/Championship/i, 'Final');
      if(n.lvl === 1 && conf) return `Final ${conf}`;
      return conf ? `${conf} · ${name}` : name;
    }
    if(lgKey === 'fbs'){
      const bowl = (/at the (?:[A-Z][\w&'.-]* )*?((?:[\w&'.-]+ )?Bowl(?: Classic)?)/.exec(note) || [])[1];
      return bowl && n.lvl ? `${name} · ${bowl.replace(/^(Capital One|Goodyear|Allstate|Vrbo|Chick-fil-A|Prudential)\s+/i, '')}` : name;
    }
    return name;
  };
}

/* ---------- Proyección NFL: seeds 1–7 por conferencia según las posiciones ---------- */
async function nflSeeds(season){
  const groups = await standingsOf(LG.nfl, season);
  const out = {};
  for(const gr of groups){
    const conf = /AFC/i.test(gr.abbr + gr.name + (gr.parent || '')) ? 'AFC' : /NFC/i.test(gr.abbr + gr.name + (gr.parent || '')) ? 'NFC' : null;
    if(!conf) continue;
    for(const e of arr(gr.entries)){
      const s = sn(e, 'playoffSeed');
      if(Number.isFinite(s) && s >= 1 && s <= 7){
        const w = sn(e, 'wins'), l = sn(e, 'losses'), t = sn(e, 'ties');
        (out[conf] = out[conf] || {})[s] = {team: e.team || {}, id: String(e.team?.id || ''), record: Number.isFinite(w) ? [w, l, ...(t > 0 ? [t] : [])].join('-') : ''};
      }
    }
  }
  return ['AFC', 'NFC'].every(c => out[c] && [1, 2, 3, 4, 5, 6, 7].every(s => out[c][s]?.id)) ? out : null;
}
// Busca el partido real entre dos equipos; si no existe, arma uno proyectado
function bkGame(games, a, b, slots, foot){
  if(a?.id && b?.id){
    const g = games.find(x => [x.away.id, x.home.id].includes(a.id) && [x.away.id, x.home.id].includes(b.id));
    if(g) return g;
  }
  const side = s => s ? {id: s.id, team: s.team, record: s.record} : {id: '', team: null};
  // Proyectado: arriba el mejor seed (a), abajo el rival (b)
  return {virtual: true, away: side(a), home: side(b), state: 'pre', slots: [a ? '' : slots?.[0], b ? '' : slots?.[1]], foot};
}
const bkWinner = (g, seedsById) => g && !g.virtual && g.state === 'post' ? [g.away, g.home].find(s => s.win) || null : null;
function nflConfTree(conf, S, games){
  const T = s => S[s];
  const wcPairs = [[2, 7], [3, 6], [4, 5]];
  const wc = wcPairs.map(([h, a]) => ({g: bkGame(games, T(h), T(a)), lvl: 3, kids: [], conf, pair: [h, a]}));
  const seedById = id => +Object.keys(S).find(k => S[k].id === id);
  const wins = wc.map(n => { const w = bkWinner(n.g); return w ? seedById(w.id) : null; });
  const ent = s => s ? {...T(s)} : null;
  let divA, divB;
  if(wins.every(Boolean)){
    // Ronda divisional con reordenamiento: el 1 juega contra el seed más bajo que quedó
    const order = wins.map((s, i) => ({s, i})).sort((x, y) => x.s - y.s);
    const low = order[2], others = order.slice(0, 2);
    divA = {g: bkGame(games, T(1), ent(low.s)), lvl: 2, conf, kids: [{team: T(1).team, id: T(1).id, record: T(1).record, lvl: 3, conf}, wc[low.i]]};
    divB = {g: bkGame(games, ent(others[0].s), ent(others[1].s)), lvl: 2, conf, kids: [wc[others[0].i], wc[others[1].i]]};
  } else {
    divA = {g: bkGame(games, T(1), null, ['', 'Peor seed vivo']), lvl: 2, conf, kids: [{team: T(1).team, id: T(1).id, record: T(1).record, lvl: 3, conf}, wc[2]]};
    divB = {g: bkGame(games, null, null, ['Ganador 2–7', 'Ganador 3–6']), lvl: 2, conf, kids: [wc[0], wc[1]]};
  }
  const wa = bkWinner(divA.g), wb = bkWinner(divB.g);
  const hi = (x, y) => { if(!x || !y) return [x, y]; return seedById(x.id) <= seedById(y.id) ? [x, y] : [y, x]; };
  const [h, a] = hi(wa ? ent(seedById(wa.id)) : null, wb ? ent(seedById(wb.id)) : null);
  const cg = {g: bkGame(games, h, a, ['Ganador', 'Ganador']), lvl: 1, conf, kids: [divA, divB]};
  return cg;
}
async function nflProjected(season, games){
  const S = await nflSeeds(season);
  if(!S) return null;
  const afc = nflConfTree('AFC', S.AFC, games), nfc = nflConfTree('NFC', S.NFC, games);
  const ca = bkWinner(afc.g), cn = bkWinner(nfc.g);
  const pick = (w, conf) => w ? Object.values(S[conf]).find(x => x.id === w.id) : null;
  const sb = {g: bkGame(games, pick(cn, 'NFC'), pick(ca, 'AFC'), ['Campeón NFC', 'Campeón AFC']), lvl: 0, kids: [afc, nfc]};
  const seedOf = id => { for(const c of ['AFC', 'NFC']) for(const k in S[c]) if(S[c][k].id === id) return k; return ''; };
  return {root: sb, seedOf, S};
}

/* ---------- Proyección FBS: ranking CFP + reglas de la temporada ---------- */
async function cfpRanking(season){
  const d = await getSite(`${SITE}/${LG.fbs.slug}/rankings`);
  const r = arr(d?.rankings).find(x => x?.type === 'cfp');
  if(!r || num(r.season?.year) !== season) return null;
  return {date: r.date ? new Date(r.date) : null, week: r.occurrence?.displayValue || '', ranks: arr(r.ranks).map(x => ({rank: num(x.current), id: String(x.team?.id || ''), team: x.team || {}, conf: x.conference || '', record: x.recordSummary || ''})).filter(x => x.rank && x.id)};
}
function cfpField(rule, ranks){
  const top = ranks.slice().sort((a, b) => a.rank - b.rank);
  const why = new Map();
  for(const c of rule.p4){ const t = top.find(x => x.conf === c); if(t) why.set(t.id, `Campeón proyectado de ${c} (el mejor rankeado)`); }
  const g6 = top.find(x => rule.g6.test(x.conf));
  if(g6 && !why.has(g6.id)) why.set(g6.id, `Mejor rankeado del Group of Six (${g6.conf})`);
  const nd = top.find(x => x.id === rule.notreDame);
  if(nd && nd.rank <= 12 && !why.has(nd.id)) why.set(nd.id, 'Notre Dame en el top 12');
  const field = top.filter(x => why.has(x.id));
  for(const t of top){ if(field.length >= rule.teams) break; if(!why.has(t.id)) field.push(t); }
  const inTop = field.filter(t => t.rank <= rule.teams).sort((a, b) => a.rank - b.rank), out = field.filter(t => t.rank > rule.teams).sort((a, b) => a.rank - b.rank);
  return {seeds: inTop.concat(out).map((t, i) => ({...t, seed: i + 1, why: why.get(t.id) || 'Por ranking'})), g6Missing: !g6};
}
function cfpTree(seeds, games){
  const T = s => seeds[s - 1] ? {id: seeds[s - 1].id, team: seeds[s - 1].team, record: seeds[s - 1].record} : null;
  const fr = [[8, 9], [7, 10], [6, 11], [5, 12]].map(([h, a]) => ({g: bkGame(games, T(h), T(a)), lvl: 3, kids: []}));
  const seedById = id => (seeds.find(s => s.id === id) || {}).seed;
  const ent = w => w ? T(seedById(w.id)) : null;
  const qf = [1, 2, 3, 4].map((s, i) => { const w = bkWinner(fr[i].g); const pair = [[8, 9], [7, 10], [6, 11], [5, 12]][i];
    return {g: bkGame(games, T(s), ent(w), ['', `Ganador ${pair[0]}–${pair[1]}`]), lvl: 2, kids: [{team: T(s).team, id: T(s).id, record: T(s).record, lvl: 3}, fr[i]]}; });
  const semi = (x, y) => { const a = ent(bkWinner(x.g)), b = ent(bkWinner(y.g)); return {g: bkGame(games, a, b, ['Ganador', 'Ganador']), lvl: 1, kids: [x, y]}; };
  const s1 = semi(qf[0], qf[3]), s2 = semi(qf[1], qf[2]);
  const f = {g: bkGame(games, ent(bkWinner(s1.g)), ent(bkWinner(s2.g)), ['Ganador semifinal', 'Ganador semifinal']), lvl: 0, kids: [s1, s2]};
  return f;
}

/* ---------- Solapa "Playoffs" de la liga ---------- */
async function tabPlayoffs(r, lg, season){
  if(!BRACKET_LG.includes(lg.key)) return emptyBox('Esta liga todavía no tiene cuadro de playoffs', '');
  if(lg.key === 'fbs' && season < 2014) return emptyBox('Antes de 2014 no había playoff en FBS', `El campeón salía de la final del BCS (1998–2013) o de las encuestas. Mirá la solapa <a href="#/fbs/palmares/${season}">Palmarés</a>.`);
  const games = await postseasonEvents(lg, season);
  const lv = BK_LEVELS[lg.key];
  const finalRe = lg.key === 'nfl' ? /super bowl/i : lg.key === 'fbs' ? /national championship/i : /./;
  // FBS: la final es la del CFP; el resto del cuadro sale de los partidos que ganaron los finalistas antes (algunas semis viejas no dicen "CFP")
  const final = games.filter(g => (finalRe.test(g.note) && (lg.key !== 'fbs' || BK_CFP_RE.test(g.note))) || lg.key === 'ufl').slice(-1)[0];
  const cfpGames = lg.key === 'fbs' ? games.filter(g => BK_CFP_RE.test(g.note)) : games;
  const title = {nfl: 'Playoffs de la NFL', fbs: 'College Football Playoff', ufl: 'Playoffs de la UFL'}[lg.key];
  const hint = '<div class="bk-hint">Tocá un partido para ver el detalle · en el celular deslizá el cuadro hacia los costados</div>';
  // 1) Temporada con la final jugada: cuadro real
  if(final && final.state === 'post' && final.away.id && final.home.id){
    const root = bkTreeFromFinal(games, final);
    let seedOf = () => '';
    const ids = new Set(); (function walk(n){ if(n.g){ ids.add(n.g.away.id); ids.add(n.g.home.id); } else ids.add(n.id); arr(n.kids).forEach(walk); })(root);
    if(lg.key === 'fbs'){ const m = {}; cfpGames.forEach(g => [g.away, g.home].forEach(s => { if(s.rank && s.rank <= 12 && !m[s.id]) m[s.id] = s.rank; })); if([...ids].every(id => m[id])) seedOf = id => m[id] || ''; }
    if(lg.key === 'nfl'){
      try{ const groups = await standingsOf(lg, season); const m = {}; groups.forEach(gr => arr(gr.entries).forEach(e => { const s = sn(e, 'playoffSeed'); if(Number.isFinite(s) && s > 0) m[String(e.team?.id)] = s; }));
        if([...ids].every(id => m[id])) seedOf = id => m[id] || ''; }catch(e){}
    }
    const ctx = {lg: lg.key, seedOf, label: bkLabelFn(lg.key), champ: bkChamp};
    return `<div class="ph">🏆 ${esc(title)} ${season} <span class="cnt">· cuadro final</span></div><div class="box bk-box">${hint}${bkRender(root, ctx)}</div>`;
  }
  // 2) Temporada en curso: proyección + partidos ya jugados
  if(lg.key === 'nfl'){
    const p = await nflProjected(season, games).catch(() => null);
    if(!p) return games.length ? bkPartial(lg, season, games, title) : emptyBox('Todavía no hay cuadro de playoffs para esta temporada', 'ESPN no informa los seeds de los equipos.');
    const started = games.some(g => g.state !== 'pre');
    const note = started ? 'Playoffs en curso: los partidos jugados ya están en el cuadro.'
      : 'Si los playoffs empezaran hoy · seeds según las posiciones de ESPN: del 1 al 4 los líderes de división y del 5 al 7 los comodines. El 1 de cada conferencia descansa en la primera ronda y en la divisional juega contra el seed más bajo que avance.';
    const ctx = {lg: 'nfl', seedOf: p.seedOf, label: bkLabelFn('nfl'), champ: bkChamp};
    return `<div class="ph">🏆 ${esc(title)} ${season} <span class="cnt">· ${started ? 'en juego' : 'proyección'}</span></div><div class="box bk-box"><div class="bk-note">${esc(note)}</div>${hint}${bkRender(p.root, ctx)}</div>`;
  }
  if(lg.key === 'fbs'){
    const rule = CFP_RULES[season];
    // Si ya hay partidos del playoff con equipos, los seeds salen de esos partidos
    const fromGames = {}; cfpGames.forEach(g => [g.away, g.home].forEach(s => { if(s.id && s.id !== '-1' && s.rank && s.rank <= 12) fromGames[s.rank] = fromGames[s.rank] || {id: s.id, team: s.team, record: s.record, rank: s.rank}; }));
    let seeds = null, rk = null, field = null;
    if(Object.keys(fromGames).length === 12) seeds = Array.from({length: 12}, (_, i) => ({...fromGames[i + 1], seed: i + 1}));
    else if(rule && season === curSeason(lg)){
      rk = await cfpRanking(season).catch(() => null);
      if(rk?.ranks.length){ field = cfpField(rule, rk.ranks); seeds = field.seeds; }
    }
    if(!seeds) return cfpGames.some(g => g.away.id && g.away.id !== '-1') ? bkPartial(lg, season, cfpGames, title) : emptyBox('Todavía no hay cuadro para esta temporada', rule ? 'El primer ranking del College Football Playoff sale a principios de noviembre.' : 'No tenemos las reglas de clasificación de esta temporada.');
    const root = cfpTree(seeds, cfpGames);
    const seedOf = id => (seeds.find(s => s.id === id) || {}).seed || '';
    const ctx = {lg: 'fbs', seedOf, label: bkLabelFn('fbs'), champ: bkChamp};
    const when = rk?.date ? ` del ${rk.date.toLocaleDateString('es-AR', {day: 'numeric', month: 'long'})}` : '';
    const note = field ? `Si el playoff empezara hoy · ranking CFP${when}${rk.week ? ' (' + weekLabel(rk.week) + ')' : ''}. Entran los campeones de ACC, Big Ten, Big 12 y SEC (acá, el mejor rankeado de cada una), el mejor del Group of Six y Notre Dame si está en el top 12; el resto, por ranking. Del 1 al 4 descansan en primera ronda.${field.g6Missing ? ' Ningún equipo del Group of Six está en el top 25: ese lugar todavía no se puede proyectar.' : ''}` : 'Playoff en curso: los partidos jugados ya están en el cuadro.';
    const table = field ? `<div class="ph sm">Los 12 de hoy</div><div class="box tw"><table class="tbl"><thead><tr><th>Seed</th><th class="l">Equipo</th><th>CFP</th><th>Récord</th><th class="l hm">Por qué entra</th></tr></thead><tbody>${seeds.map(s => `<tr><td><b>${s.seed}</b></td><td class="l"><a class="tmc" href="#/fbs/team/${esc(s.id)}">${logo(s.team)}<span>${esc(tName(s.team))}</span></a></td><td>#${s.rank}</td><td>${esc(s.record)}</td><td class="l hm">${esc(s.why)}</td></tr>`).join('')}</tbody></table></div>` : '';
    return `<div class="ph">🏆 ${esc(title)} ${season} <span class="cnt">· ${field ? 'proyección' : 'en juego'}</span></div><div class="box bk-box"><div class="bk-note">${esc(note)}</div>${hint}${bkRender(root, ctx)}</div>${table}`;
  }
  return games.length ? bkPartial(lg, season, games, title) : emptyBox('Todavía no hay playoffs para esta temporada', 'El cuadro aparece cuando se jueguen.');
}
// Sin proyección posible: lista de los partidos de playoff por fecha
function bkPartial(lg, season, games, title){
  return `<div class="ph">🏆 ${esc(title)} ${season} <span class="cnt">· en juego</span></div><div class="box">${games.map(gameRow).join('')}</div>`;
}

VIEWS.league = async (r, el, ctx) => {
  const lg = LG[r.lg];
  const season = r.season || curSeason(lg);
  const head = leagueHead(lg, r.tab, season);
  if(!ctx.silent) paint(ctx, el, head + `<div id="tabc">${r.tab === 'partidos' ? skeleton(8) : spinner()}</div>`);
  let body;
  try{
    if(r.tab === 'partidos') body = await tabPartidos(r, lg, season, ctx);
    else if(r.tab === 'posiciones') body = await tabPosiciones(r, lg, season);
    else if(r.tab === 'palmares') body = await leagueHonoursHTML(lg, season);
    else if(r.tab === 'playoffs') body = await tabPlayoffs(r, lg, season);

};

const STYPE = {1: 'Pretemporada', 2: 'Temporada regular', 3: 'Playoffs', 4: 'Receso'};
function weekLabel(s){
  return String(s || '').replace(/^Week\s*(\d+)/i, 'Sem $1').replace(/Wild ?Card/i, 'Comodines').replace(/Divisional Round/i, 'Divisional')
    .replace(/Conference Championship/i, 'Final de Conf.').replace(/Hall of Fame Weekend/i, 'Hall of Fame').replace(/Bowls?$/i, 'Bowls')
    .replace(/Conference Championships?/i, 'Finales de Conf.').replace(/Semifinals?/i, 'Semifinal').replace(/Championship/i, 'Final').replace(/Quarterfinals?/i, 'Cuartos');
}
async function cflPartidos(lg, season, ctx){
  const isCur = season === curSeason(lg);
  let events, title;
  if(isCur){
    const today = startOfDay(new Date());
    events = await fetchDates(lg, Array.from({length: 11}, (_, i) => addDays(today, i - 3)));
    title = 'Partidos de estos días';
  }else{
    events = await tsdbEvents(`eventsseason.php?id=${TSDB_CFL}&s=${season}`);
    title = `Temporada ${season}`;
  }
  const games = events.map(e => normGame(e, lg.key)).sort((a, b) => a.date - b.date);
  if(alive(ctx)) state.liveInView = games.some(g => g.state === 'in' || isSoon(g));
  const note = `<div class="legend">Datos de la CFL: TheSportsDB (ESPN dejó de publicarla después de 2022). ${isCur ? 'Se muestran los partidos de los últimos 3 días y los próximos 7.' : 'La fuente gratuita trae solo algunos partidos de cada temporada pasada.'}</div>`;
  if(!games.length) return note + emptyBox('Sin partidos', isCur ? 'No hay partidos de la CFL en estos días.' : 'TheSportsDB no tiene partidos de esa temporada.');
  let lastDay = '', rows = '';
  for(const g of games){ const dk = ymd(g.date); if(dk !== lastDay){ rows += `<div class="dayh">${esc(fmtLong(g.date))}</div>`; lastDay = dk; } rows += gameRow(g); }
  const live = games.filter(g => g.state === 'in').length;
  return note + `<div class="ph ${live ? 'red' : ''}">${lgLogo(lg)} ${esc(title)} <span class="cnt">· ${pluralize(games.length, 'partido', 'partidos')}${live ? ` · ${live} en vivo` : ''}</span></div><div class="box">${rows}</div>`;
}
async function tabPartidos(r, lg, season, ctx){
  if(lg.src === 'tsdb') return cflPartidos(lg, season, ctx);
  const cur = lg.cur || {};
  let stype = r.stype, week = r.week;
  if(!stype){
    if(season === cur.season && cur.stype && cur.stype < 4 && cur.week){ stype = cur.stype; week = cur.week; }
    else { stype = 2; week = 1; }
  }
  if(!week) week = 1;
  const d = await API.get(sbUrl(lg, {dates: season, seasontype: stype, week}));
  const games = arr(d.events).map(e => normGame(e, lg.key)).sort((a, b) => a.date - b.date);
  if(alive(ctx)) state.liveInView = games.some(g => g.state === 'in' || isSoon(g));
  // Calendario de semanas (de la respuesta) o fallback
  let cal = arr(arr(d.leagues)[0]?.calendar).filter(c => c && typeof c === 'object' && String(c.value) !== '4' && arr(c.entries).length);
  if(!cal.length){
    const max = {1: 4, 2: lg.key === 'cfl' ? 21 : lg.college ? 16 : lg.key === 'ufl' ? 10 : 18, 3: lg.college ? 6 : 5};
    cal = [1, 2, 3].map(t => ({value: String(t), label: STYPE[t], entries: Array.from({length: max[t]}, (_, i) => ({value: String(i + 1), label: (t === 2 ? 'Sem ' : 'Ronda ') + (i + 1)}))}));
  }
  const typeBtns = cal.map(c => {
    const t = num(c.value); const first = arr(c.entries)[0];
    return `<a class="btn ${t === stype ? 'on' : ''}" href="#/${lg.key}/partidos/${season}/${t}/${esc(first?.value || 1)}">${esc(STYPE[t] || c.label)}</a>`;
  }).join('');
  const curType = cal.find(c => num(c.value) === stype) || cal[0];
  const weeks = arr(curType?.entries).map(e => `<a class="wk ${num(e.value) === week ? 'on' : ''}" href="#/${lg.key}/partidos/${season}/${stype}/${esc(e.value)}" title="${esc(e.detail || e.alternateLabel || '')}">${esc(weekLabel(e.label || e.alternateLabel || ('Sem ' + e.value)))}</a>`).join('');
  const entry = arr(curType?.entries).find(e => num(e.value) === week);
  let list = '';
  if(!games.length) list = emptyBox('Sin partidos', 'ESPN no devolvió partidos para esta semana.');
  else {
    let lastDay = '', rows = '';
    for(const g of games){
      const dk = ymd(g.date);
      if(dk !== lastDay){ rows += `<div class="dayh">${esc(fmtLong(g.date))}</div>`; lastDay = dk; }
      rows += gameRow(g);
    }
    const live = games.filter(g => g.state === 'in').length;
    list = `<div class="ph ${live ? 'red' : ''}">${lgLogo(lg)} ${esc(entry ? weekLabel(entry.label) : 'Semana ' + week)} · ${esc(STYPE[stype] || '')} <span class="cnt">· ${pluralize(games.length, 'partido', 'partidos')}${live ? ` · ${live} en vivo` : ''}</span></div><div class="box">${rows}</div>`;
  }
  return `<div class="btnrow">${typeBtns}</div><div class="wkbar">${weeks}</div>${list}`;
}

async function tabPosiciones(r, lg, season){
  if(lg.src === 'tsdb') return emptyBox('Posiciones no disponibles', `ESPN dejó de publicar la CFL después de 2022 y la fuente gratuita que usamos (TheSportsDB) no incluye la tabla. Mientras tanto, mirá los <a href="#/${lg.key}/partidos">partidos</a> o el <a href="#/${lg.key}/palmares">palmarés</a>.`);
  const mode = lg.college ? 'conf' : state.standMode;
  const groups = await standingsOf(lg, season, mode);
  const toggle = lg.college ? '' : `<div class="btnrow"><button class="btn ${mode === 'div' ? 'on' : ''}" onclick="App.setStand('div')">Por división</button><button class="btn ${mode === 'conf' ? 'on' : ''}" onclick="App.setStand('conf')">Por conferencia</button></div>`;
  if(!groups.length) return toggle + emptyBox('Sin posiciones', 'ESPN no devolvió posiciones para esta temporada.');
  let html = toggle, lastParent = null, hasClinch = false;
  const isConfView = mode === 'conf';
  for(const gr of groups){
    if(gr.parent && gr.parent !== lastParent){ html += `<h3 class="conf-h">★ ${esc(gr.parent)}</h3>`; lastParent = gr.parent; }
    const ents = sortEntries(gr.entries, lg, isConfView);
    const showConf = lg.college && ents.some(confStat);
    const rows = ents.map((e, i) => {
      const t = e.team || {};
      const w = sv(e, 'wins') ?? '-', l = sv(e, 'losses') ?? '-', ti = sv(e, 'ties') ?? '0';
      const pct = sv(e, 'winPercent') ?? '-';
      const pf = sn(e, 'pointsFor'), pa = sn(e, 'pointsAgainst');
      let diff = sn(e, 'differential', 'pointDifferential');
      if(isNaN(diff) && !isNaN(pf) && !isNaN(pa)) diff = pf - pa;
      const strk = sv(e, 'streak') || '-';
      const cl = sv(e, 'clincher');

async function tabStats(r, lg, season, ctx){

      const t = (tid && (lg.teamIdx?.[tid] || extraTeams[tid])) || {};
      const nm = a.displayName || a.fullName || a.shortName || 'Jugador #' + (aid || '?');
      return `<div class="ldr ${i === 0 ? 'top' : ''}"><span class="n">${i + 1}</span>${headshot(a.headshot?.href, 'hs', nm)}

    }).join('');
    return `<div><div class="ph">${esc(c.title)} ${c.abbr ? `<span class="cnt">(${esc(c.abbr)})</span>` : ''}</div><div class="box">${rows}</div></div>`;

/* El resumen de ESPN no trae la "situación" (posesión, yarda, down y distancia): sale del marcador general.
   NFL/UFL/CFL usan el marcador de la semana (el mismo de la cartelera); college, el del día del partido (horario del Este). */
async function liveSituation(lgKey, id, date, force){
  const lg = LG[lgKey]; if(!lg) return null;
  const find = d => arr(d?.events).find(e => String(e.id) === String(id));
  const etDay = () => { try{ const f = new Intl.DateTimeFormat('en-CA', {timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'}).format(date); return f.replace(/-/g, ''); }catch(e){ return ymd(date); } };
  let ev = !lg.group && !force ? find(lg.probe) : null;
  if(!ev){
    try{
      const d = await API.get(lg.group ? sbUrl(lg, {dates: etDay()}) : sbUrl(lg), force ? {force: true} : undefined);
      if(!lg.group) lg.probe = d;
      ev = find(d);
    }catch(e){}
  }
  return arr(ev?.competitions)[0]?.situation || null;
}
async function refreshGamecast(){
  const r = state.route, ctx = {id: state.renderId, silent: true}, box = $('#gamecastBox');
  if(Gamecast.busy || !gamecastEnabled(r) || !box) return;
  Gamecast.busy = true;
  try{
    const d = await getSite(`${SITE}/${LG[r.lg].slug}/summary?event=${encodeURIComponent(r.id)}`, {force: true, ttl: 10e3, noStale: true});
    if(!alive(ctx) || !gamecastEnabled(state.route) || !$('#gamecastBox')) return;
    const hc = arr(d.header?.competitions)[0] || {};
    const g = normGame({id: r.id, competitions: [hc], date: hc.date}, r.lg);
    if(!g.home.id || !g.away.id) throw new Error('Faltan los equipos');
    if(!d.situation && g.state === 'in') g.situation = await liveSituation(r.lg, r.id, g.date, true) || g.situation;
    if(!alive(ctx) || !$('#gamecastBox')) return;
    const m = gamecastModel(d, g), current = $('#gamecastBox');
    const fresh = current.querySelector('#gcFresh');
    // El reloj cambia sin reconstruir la cancha. La animación corre una vez por jugada nueva.
    const signature = m.signature;
    if(current.dataset.signature !== signature){
      const holder = document.createElement('div'); holder.innerHTML = gamecastHTML(d, g, current.dataset.play !== m.key);
      const next = holder.firstElementChild; next.dataset.signature = signature; current.replaceWith(next);
    }else if(fresh){ fresh.classList.remove('gc-error'); fresh.textContent = g.state === 'post' ? 'Partido finalizado' : 'Actualizado ' + new Date().toLocaleTimeString('es-AR', {hour12: false}); }
    const clock = $('#gamecastBox .gc-clock'); if(clock) clock.textContent = statusInfo(g).txt;
    const scores = document.querySelectorAll('.gh .led');
    if(scores.length === 2){ scores[0].textContent = g.away.score ?? '0'; scores[1].textContent = g.home.score ?? '0'; }
    const status = $('.gh .stat'); if(status) status.innerHTML = (g.state === 'in' ? '<span class="live">EN VIVO</span> ' : '') + esc(statusInfo(g).txt);
    // El refresco general existente completa las tablas cuando el partido termina.
  }catch(e){
    if(alive(ctx)){ const fresh = $('#gcFresh'); if(fresh){ fresh.textContent = 'Sin conexión · conservamos la última jugada'; fresh.classList.add('gc-error'); } }
  }finally{ Gamecast.busy = false; }
}

VIEWS.game = async (r, el, ctx) => {

  if(g.situation?.possession != null){ const p = String(g.situation.possession); g.away.possession = p === g.away.id; g.home.possession = p === g.home.id; }
  if(g.state !== 'in'){ g.away.possession = g.home.possession = false; }
  if(!g.tv) g.tv = getTV({broadcasts: d.broadcasts}) || '';
  const ar = arInfo(r.lg, g.tv, g.date, num(d.header?.season?.type));
  g.ar = ar; g.tvAR = ar?.short || ''; g.tvARlong = ar?.long || '';
  state.liveInView = g.state === 'in' || isSoon(g);

  const A = g.away, H = g.home;
  const season = num(d.header?.season?.year) || curSeason(lg);
  const tlink = (c) => isTsdbId(c.id) ? `#/${lg.key}/palmares` : c.id ? `#/${lg.key}/team/${c.id}/plantel/${season}` : '#';   // la CFL no tiene página de equipo
  const side = (c) => `<div class="side">${logo(c.team)}<a href="${tlink(c)}">${c.rank ? '#' + c.rank + ' ' : ''}${esc(c.team.displayName || tName(c.team))}</a><small>${esc(c.record || '')}</small>${c.possession ? '<span class="poss"><span class="ball"></span> Posesión</span>' : ''}</div>`;
  const pre = g.state === 'pre';
  const venue = d.gameInfo?.venue || hc.venue || {};
  const vtxt = [venue.fullName, [venue.address?.city, venue.address?.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
  const stTxt = pre ? (s.k === 'ppd' ? s.txt : `${fmtLong(g.date)} · ${s.txt}`) : s.txt;
  let html = `<div class="crumb"><a href="#/hoy">Hoy</a> › <a href="#/${lg.key}/partidos">${esc(lg.name)}</a> › ${esc(tAbbr(A.team))} @ ${esc(tAbbr(H.team))}</div>
    <div class="gh" style="--ca:${teamColor(A.team)};--ch:${teamColor(H.team)}">
      ${side(A)}
      <div class="mid">
        ${pre ? `<div class="ledrow"><span class="led" style="font-size:30px">@</span></div>` : `<div class="ledrow"><span class="led ${H.win ? 'lose' : ''}">${esc(A.score ?? '0')}</span><span class="led ${A.win ? 'lose' : ''}">${esc(H.score ?? '0')}</span></div>`}
        <div class="stat">${g.state === 'in' ? '<span class="live">EN VIVO</span> ' : ''}${esc(stTxt)}</div>
        <div class="info">${g.ar ? `<span class="arhd">📺 ${arHTML(g)}</span>` : ''}${g.ar && vtxt ? '<br>' : ''}${esc(vtxt)}</div>
      </div>
      ${side(H)}
    </div>`;
  if(gamecastEnabled(r)) html += gamecastHTML(d, g, !ctx.silent || $('#gamecastBox')?.dataset.play !== gamecastModel(d, g).key);
  if(g.state === 'in' && g.situation && !gamecastEnabled(r)){
    const si = g.situation;
    const pt = A.possession ? A.team : H.possession ? H.team : null;
    html += `<div class="sitbar">${pt ? `<span class="ball"></span><b>${esc(tName(pt))}</b>` : ''}${si.downDistanceText ? `<span class="dd">${esc(si.downDistanceText)}</span>` : ''}${si.isRedZone ? '<span class="rz">ZONA ROJA</span>' : ''}${si.lastPlay?.text ? `<span class="lp">Última jugada: ${esc(si.lastPlay.text)}</span>` : ''}</div>`;
  }
  if(g.note || arr(hc.notes)[0]?.headline) html += `<div class="legend" style="text-align:center">${esc(g.note || hc.notes[0].headline)}</div>`;

  // Marcador por cuarto
  const nq = Math.max(4, A.lines.length, H.lines.length);
  if(!pre && (A.lines.length || H.lines.length)){
    const ths = Array.from({length: nq}, (_, i) => `<th>${i < 4 ? 'Q' + (i + 1) : (i === 4 ? 'OT' : (i - 3) + 'OT')}</th>`).join('');
    const tr = c => `<tr><td class="l"><span class="tmc">${logo(c.team)} <b>${esc(tAbbr(c.team))}</b></span></td>${Array.from({length: nq}, (_, i) => `<td>${esc(c.lines[i] ?? '-')}</td>`).join('')}<td class="t">${esc(c.score ?? '-')}</td></tr>`;
    html += `<div class="star-sep"><span>Marcador</span></div><div class="box tw" style="border-top:1px solid #9aa7bd"><table class="tbl ls"><thead><tr><th class="l">Equipo</th>${ths}<th class="t">T</th></tr></thead><tbody>${tr(A)}${tr(H)}</tbody></table></div>`;
  }

  // Líderes del partido
  const L = arr(d.leaders);
  if(L.length){
    const findTeam = c => L.find(x => String(x.team?.id) === c.id) || null;
    const la = findTeam(A) || L[0], lh = findTeam(H) || L[1];
    const want = ['passingYards', 'rushingYards', 'receivingYards'];
    const catsA = arr(la?.leaders), catsH = arr(lh?.leaders);
    let names = want.filter(n => catsA.some(c => c.name === n) || catsH.some(c => c.name === n));
    if(!names.length) names = [...new Set(catsA.concat(catsH).map(c => c.name))].slice(0, 3);
    const cell = (cats, n, t) => {
      const c = cats.find(x => x.name === n); const l = arr(c?.leaders)[0];
      if(!l) return '<div><span class="who" style="color:#999">—</span></div>';
      const a = l.athlete || {};
      return `<div>${headshot(a.headshot?.href, 'hs', a.displayName)}<div class="who">${a.id ? `<a href="#/${lg.key}/player/${a.id}">${esc(a.displayName || a.shortName)}</a>` : esc(a.displayName || '')} <small style="color:#888">${esc(a.position?.abbreviation || '')} · ${esc(tAbbr(t))}</small><span>${esc(l.displayValue || '')}</span></div></div>`;
    };
    const titles = {passingYards: 'Pases', rushingYards: 'Carreras', receivingYards: 'Recepciones'};
    const rows = names.map(n => {
      const c = catsA.concat(catsH).find(x => x.name === n);
      return `<div class="gl"><div class="cat">${esc(titles[n] || c?.displayName || n)}</div>${cell(catsA, n, A.team)}${cell(catsH, n, H.team)}</div>`;

  }

  // Jugadas de anotación
  const SP = arr(d.scoringPlays);
  if(SP.length){
    let last = null, rows = '';
    for(const p of SP){
      const q = num(p.period?.number);
      if(q !== last){ rows += `<div class="dayh">${q <= 4 ? q + 'º cuarto' : 'Tiempo extra'}</div>`; last = q; }
      const ab = (p.scoringType?.abbreviation || p.type?.abbreviation || '').toUpperCase();
      const tm = p.team || {};
      const t = (String(tm.id) === A.id ? A.team : String(tm.id) === H.id ? H.team : tm);
      rows += `<div class="sp-row"><span class="sp-q">${esc(p.clock?.displayValue || '')}</span><span class="sp-type ${esc(ab)}">${esc(ab || '•')}</span><span class="tmc" style="display:flex;gap:6px;align-items:center">${logo(t)}<span>${esc(p.text || '')}</span></span><span class="sp-sc">${esc(p.awayScore ?? '')}-${esc(p.homeScore ?? '')}</span></div>`;
    }
    html += `<div class="star-sep"><span>Jugadas de anotación</span></div><div class="box" style="border-top:1px solid #9aa7bd">${rows}</div>`;
  }

  // Box score por equipo (estadísticas de equipo)
  const BT = arr(d.boxscore?.teams);
  if(BT.length >= 2 && BT.some(t => arr(t.statistics).length)){
    const ba = BT.find(t => String(t.team?.id) === A.id) || BT[0], bh = BT.find(t => String(t.team?.id) === H.id) || BT[1];
    const statsH = arr(bh.statistics);
    const rows = arr(ba.statistics).map(sa => {
      const sh = statsH.find(x => x.name === sa.name) || {};
      const va = numVal(sa.displayValue), vh = numVal(sh.displayValue);
      const lowerBetter = /turnover|penalt|fumblesLost|interceptions|sacksYardsLost/i.test(sa.name || '');
      const tot = va + vh;

    html += `<div class="star-sep"><span>Estadísticas de equipo</span></div><div class="ph sm" style="justify-content:space-between"><span class="tmc" style="display:flex;gap:6px;align-items:center">${logo(A.team)} ${esc(tAbbr(A.team))}</span><span class="tmc" style="display:flex;gap:6px;align-items:center">${esc(tAbbr(H.team))} ${logo(H.team)}</span></div><div class="box">${rows}</div>`;
  }

  // Box score individual
  const BP = arr(d.boxscore?.players);
  if(BP.length){
    const pa = BP.find(p => String(p.team?.id) === A.id) || BP[0], ph = BP.find(p => String(p.team?.id) === H.id) || BP[1];
    const order = [...new Set(arr(pa?.statistics).concat(arr(ph?.statistics)).map(c => c.name))];
    const tbl = (P, c) => {
      const cat = arr(P?.statistics).find(x => x.name === c);
      if(!cat || !arr(cat.athletes).length) return '';
      const t = P.team || {};
      const labels = arr(cat.labels);
      const rows = arr(cat.athletes).map(a => `<tr><td class="l">${a.athlete?.id ? `<a href="#/${lg.key}/player/${a.athlete.id}">${esc(a.athlete.displayName || a.athlete.shortName)}</a>` : esc(a.athlete?.displayName || '')}</td>${arr(a.stats).map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('');
      const tot = arr(cat.totals).length ? `<tr class="tot"><td class="l">Total</td>${arr(cat.totals).map(x => `<td>${esc(x)}</td>`).join('')}</tr>` : '';
      return `<div><div class="bx-team" style="--tc:${teamColor(t)}">${logo(t)} ${esc(t.displayName || tName(t))}</div><div class="tw"><table class="tbl"><thead><tr><th class="l">Jugador</th>${labels.map(x => `<th title="${esc(x)}">${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows}${tot}</tbody></table></div></div>`;
    };
    const sects = order.map(c => {
      const a = tbl(pa, c), h = tbl(ph, c);
      if(!a && !h) return '';
      return `<div class="sect"><div class="ph">${esc(BOX_ES[c] || c)}</div><div class="box"><div class="boxgrid">${a}${h}</div></div></div>`;
    }).join('');

  }

  // Info del partido
  const gi = d.gameInfo || {};
  const odds = arr(d.pickcenter)[0] || arr(hc.odds)[0];
  const kv = [];
  if(vtxt) kv.push(['Estadio', vtxt]);
  kv.push(['Fecha', `${fmtLong(g.date)} · ${fmtTime(g.date)}`]);
  if(g.tvAR) kv.push(['Dónde verlo', g.tvARlong || g.tvAR]);
  if(gi.attendance) kv.push(['Asistencia', Number(gi.attendance).toLocaleString('es-AR')]);
  if(gi.weather) kv.push(['Clima', [gi.weather.displayValue, gi.weather.temperature != null ? gi.weather.temperature + '°F (' + Math.round((gi.weather.temperature - 32) * 5 / 9) + '°C)' : ''].filter(Boolean).join(' · ')]);
  if(odds?.details) kv.push(['Línea', odds.details + (odds.overUnder ? ` · O/U ${odds.overUnder}` : '')]);
  if(pre && !L.length && !SP.length) html += emptyBox('El partido todavía no comenzó', 'Las estadísticas aparecerán cuando arranque.');
  html += `<div class="star-sep"><span>Info</span></div><div class="box" style="border-top:1px solid #9aa7bd"><dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`;

  // Foro General (el mismo de la sección Foro), embebido abajo del partido
  // El refresco deportivo de Gamecast conserva el foro y su estado sin volver a consultarlo.
  const keepForo = gamecastEnabled(r) && ctx.silent && ctx.preserveForo ? $('#foroBox') : null;
  const foro = keepForo ? '<div id="gcForoSlot"></div>' : await (foroP || (Foro.configured()
    ? Foro.client().then(sb => forumBody(sb, {forum: 'general', base: `#/${r.lg}/game/${r.id}/foro`, name: 'Foro General'}, r, ctx))
    : Promise.resolve(foroSetup())).catch(e => errorBox(e, 'No se pudo cargar el foro')));
  html += `<div class="star-sep" id="foroSec"><span>Foro General</span></div>${foro}`;
  paint(ctx, el, html);
  if(keepForo && alive(ctx)) $('#gcForoSlot')?.replaceWith(keepForo);
  if(r.foroLink && !ctx.silent && alive(ctx)) $('#foroSec')?.scrollIntoView({block: 'start'});
};

async function fetchRoster(lg, id, season){
  const q = season ? '?season=' + season : '';
  try{ return await getSite(`${SITE}/${lg.slug}/teams/${id}/roster${q}`); }catch(e){}
  try{
    const d = await getSite(`${SITE}/${lg.slug}/teams/${id}?enable=roster${season ? '&season=' + season : ''}`);
    if(arr(d.team?.athletes).length) return {athletes: d.team.athletes, coach: d.team.coach};
  }catch(e){}
  return coreRoster(lg, id, season || curSeason(lg));
}
/* Plantel desde la API core (referencias $ref resueltas en paralelo) */
async function coreRoster(lg, id, season){
  const d = await API.get(`${CORE}/${lg.slug}/seasons/${season}/teams/${id}/athletes?limit=300`, {ttl: LONG_TTL});
  const refs = arr(d.items).map(i => i.$ref).filter(Boolean);
  if(!refs.length) return {athletes: []};
  const aths = (await pool(refs, 12, u => API.get(u, {ttl: LONG_TTL}))).filter(a => a && a.id);
  const colRefs = [...new Set(aths.map(a => a.college?.$ref).filter(Boolean))];
  const cols = await pool(colRefs, 12, u => API.get(u, {ttl: LONG_TTL}));
  const cmap = Object.fromEntries(colRefs.map((u, i) => [u, cols[i]]));
  return {athletes: aths.map(a => {
    const c = a.college?.$ref ? cmap[a.college.$ref] : a.college;
    return {...a, college: c ? {name: c.name || c.displayName || c.shortDisplayName} : null};
  })};
}

  const cal = arr(arr(first.leagues)[0]?.calendar).filter(c => c && typeof c === 'object' && ['1', '2', '3'].includes(String(c.value)));
  const jobs = [];
  for(const c of cal) for(const e of arr(c.entries)) if(num(e.value)) jobs.push({t: num(c.value), w: num(e.value)});
  if(!jobs.length) for(let w = 1; w <= 18; w++) jobs.push({t: 2, w});
  const res = await pool(jobs, 6, j => API.get(sbUrl(lg, {dates: season, seasontype: j.t, week: j.w})).then(d => ({...j, d})));
  const mine = ev => arr(arr(ev.competitions)[0]?.competitors).some(c => String(c.id || c.team?.id) === String(id));
  const out = [1, 2, 3].map(t => ({t, d: {events: res.filter(x => x && x.t === t).flatMap(x => arr(x.d.events).filter(mine).map(ev => ({...ev, week: {...(ev.week || {}), number: x.w}})))}}));
  if(lg.key === 'nfl'){
    const played = new Set(out[1].d.events.map(ev => num(ev.week?.number)));
    const regWeeks = jobs.filter(j => j.t === 2 && res.some(x => x && x.t === 2 && x.w === j.w && arr(x.d.events).length)).map(j => j.w);
    const bye = regWeeks.find(w => !played.has(w));
    if(bye) out[1].d.byeWeek = bye;
  }
  return out;
}

async function teamFixture(lg, id, season, ctx){
  let res = await Promise.all([1, 2, 3].map(t => getSite(`${SITE}/${lg.slug}/teams/${id}/schedule?season=${season}&seasontype=${t}`).then(d => ({t, d}), () => ({t, d: null}))));
  if(res.every(x => !arr(x.d?.events).length)){
    try{ res = await scheduleFromScoreboards(lg, id, season); }
    catch(e){ if(res.every(x => !x.d)) throw e; }
  }
  const seen = new Set();
  const byType = {};
  let bye = null;
  for(const {t, d} of res){
    if(!d) continue;
    if(t === 2 && d.byeWeek) bye = num(d.byeWeek);
    for(const ev of arr(d.events)){
      if(seen.has(ev.id)) continue; seen.add(ev.id);
      const g = normGame(ev, lg.key);
      const tt = g.stype || t;
      (byType[tt] = byType[tt] || []).push({g, ev});
    }
  }
  const types = Object.keys(byType).map(Number).sort();
  if(!types.length) return emptyBox('Sin partidos', `ESPN no devolvió partidos para ${season}.`);
  let live = false, html = '';
  for(const t of types){
    const list = byType[t].sort((a, b) => a.g.date - b.g.date);
    let rows = '', byeDone = false;
    for(const {g, ev} of list){
      if(g.state === 'in' || isSoon(g)) live = true;
      const wk = num(ev.week?.number);
      if(t === 2 && bye && !byeDone && wk && wk > bye){ rows += `<tr class="bye"><td>${bye}</td><td colspan="6" class="l">Semana libre (BYE)</td></tr>`; byeDone = true; }
      const me = g.home.id === String(id) ? g.home : g.away;
      const op = me === g.home ? g.away : g.home;
      const at = me === g.home ? 'vs' : '@';
      let result;
      if(g.state === 'post'){
        const ms = parseFloat(me.score), os = parseFloat(op.score);
        const R = me.win ? 'W' : op.win ? 'L' : (ms > os ? 'W' : ms < os ? 'L' : 'T');
        result = `<span class="res ${R}">${R === 'W' ? 'G' : R === 'L' ? 'P' : 'E'}</span><b>${esc(me.score ?? '-')}-${esc(op.score ?? '-')}</b>${g.period > 4 ? ' OT' : ''}`;
      } else {
        const s = statusInfo(g);
        result = g.state === 'in' ? `<span class="live">EN VIVO</span> <b>${esc(me.score ?? 0)}-${esc(op.score ?? 0)}</b>` : esc(s.txt);
      }
      const wlabel = ev.week?.text ? weekLabel(ev.week.text) : (wk ? wk : '-');
      rows += `<tr onclick="location.hash='#/${lg.key}/game/${esc(g.id)}'" style="cursor:pointer"><td>${esc(wlabel)}</td><td class="l">${esc(fmtShort(g.date))}</td>
        <td class="l"><span class="tmc"><span style="color:#888;width:16px">${at}</span>${logo(op.team)}<a href="#/${lg.key}/game/${esc(g.id)}">${esc(op.team.displayName || tName(op.team))}</a></span></td>
        <td class="l">${result}</td><td class="hm">${arHTML(g, true)}</td><td class="hm">${esc(me.record || '')}</td></tr>`;
    }
    html += `<div class="sect"><div class="ph">${esc(STYPE[t] || 'Partidos')} <span class="cnt">· ${list.length} partidos</span></div><div class="box tw"><table class="tbl"><thead><tr><th>Sem</th><th class="l">Fecha</th><th class="l">Rival</th><th class="l">Resultado</th><th class="hm l" title="${AR_TIP}">Dónde verlo</th><th class="hm">Récord</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  if(alive(ctx)) state.liveInView = live;
  return html;
}

function findCats(d){
  const direct = d?.results?.stats?.categories || d?.statistics?.splits?.categories || d?.splits?.categories || d?.results?.categories || d?.statistics?.categories;
  if(arr(direct).length) return arr(direct);
  let found = null;
  (function walk(o, depth){
    if(found || !o || typeof o !== 'object' || depth > 6) return;
    if(Array.isArray(o.categories) && o.categories.some(c => arr(c?.stats).length)){ found = o.categories; return; }
    for(const k in o) walk(o[k], depth + 1);
  })(d, 0);
  return arr(found);
}

  const cards = cats.map(c => {

function foroErr(e){
  const m = String(e?.message || e || '');
  if(/does not exist|schema cache|could not find the (table|function)/i.test(m)) return 'La base del foro está desactualizada: volvé a ejecutar supabase/foro.sql completo en el SQL Editor de Supabase. (' + m + ')';
  if(/too_fast/i.test(m)) return 'Esperá unos segundos antes de volver a publicar.';
  if(/bucket not found/i.test(m)) return 'Falta instalar el almacenamiento de imágenes del foro: volvé a ejecutar supabase/foro.sql completo en el SQL Editor de Supabase.';
  if(/payload too large|maximum allowed size|mime type|invalid_mime/i.test(m)) return 'la imagen no es válida o pesa más de 1 MB.';
  if(/already registered|already been registered/i.test(m)) return 'Ese mail ya está registrado en otra cuenta.';
  if(/invalid login credentials/i.test(m)) return 'Usuario/mail o contraseña incorrectos.';
  if(/password should be|weak password|at least/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
  if(/database error saving new user|duplicate key/i.test(m)) return 'Ese nombre de usuario ya está en uso.';
  if(/invalid format/i.test(m)) return 'El mail no es válido.';
  if(/validate email|email address.*invalid/i.test(m)) return 'Supabase rechazó la cuenta interna del usuario (' + m + ').';
  if(/signups? not allowed|signup.*disabled/i.test(m)) return 'El registro está desactivado en la configuración de Supabase.';
  if(/email not confirmed/i.test(m)) return 'La cuenta quedó pendiente de confirmación: en Supabase hay que desactivar "Confirm email".';
  if(/rate limit|too many/i.test(m)) return 'Demasiados intentos seguidos. Esperá unos minutos y probá de nuevo.';
  if(/not_authenticated|JWT|row-level security/i.test(m)) return 'Tenés que entrar con tu usuario para hacer eso.';
  if(/failed to fetch|network/i.test(m)) return 'No se pudo conectar con el foro. Revisá tu conexión.';
  return m || 'Ocurrió un error en el foro.';
}
function timeAgo(iso){
  const d = new Date(iso); const s = (Date.now() - d) / 1000;
  if(isNaN(s)) return '';
  if(s < 60) return 'recién';
  if(s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if(s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  if(s < 7 * 86400) return `hace ${Math.floor(s / 86400)} d`;
  return fmtDate(d);
}

  return n ? {id: String(id), displayName: n[0], abbreviation: n[1], logo: `https://a.espncdn.com/i/teamlogos/nfl/500/${n[1].toLowerCase()}.png`} : null;
};
function teamBadge(id){
  const t = nflTeam(id);
  return t ? `<a class="fteam" href="#/nfl/team/${t.id}/foro" title="Hincha de ${esc(t.displayName)}">${logo(t)}<span>${esc(t.abbreviation || '')}</span></a>` : '';
}
/* Texto del mensaje: escapado, citas [quote=usuario]…[/quote], links, imágenes [img]…[/img] y saltos de línea.
   Solo se muestran imágenes subidas a la carpeta del foro en Supabase (nunca de otros sitios), hasta 4 por mensaje. */
function renderBody(txt){
  let h = esc(txt);
  const imgs = [];
  h = h.replace(FORO_IMG_RE, (m, u) => imgs.length < FORO_IMG_MAX ? (imgs.push(u), `\u0000${imgs.length - 1}\u0000`) : '');
  for(let i = 0; i < 6; i++){
    const n = h.replace(/\[quote=([A-Za-z0-9_]{1,20})\]((?:(?!\[quote=)[\s\S])*?)\[\/quote\]\n?/g, (m, u, b) => `<blockquote class="fq"><cite>${u} escribió:</cite>${b.trim()}</blockquote>`);
    if(n === h) break; h = n;
  }
  h = h.replace(/https?:\/\/[^\s<"']+/g, u => `<a href="${u}" target="_blank" rel="noopener nofollow ugc">${u}</a>`);
  h = h.replace(/\u0000(\d+)\u0000\n?/g, (m, i) => `<a class="fimg-w" href="${imgs[i]}" target="_blank" rel="noopener" onclick="return App.foroImgOpen(this)"><img class="fimg" src="${imgs[i]}" alt="Imagen del mensaje" loading="lazy"></a>`);
  return h.replace(/\n/g, '<br>');
}
function pager(base, page, total, per){
  const pages = Math.max(1, Math.ceil((total || 0) / per));
  if(pages <= 1) return '';
  let h = '<div class="pager">';
  for(let i = 1; i <= pages; i++){
    if(pages > 9 && i > 2 && i < pages - 1 && Math.abs(i - page) > 1){ if(!h.endsWith('…</span>')) h += '<span class="n">…</span>'; continue; }
    h += `<a class="btn ${i === page ? 'on' : ''}" href="${base}/${i}">${i}</a>`;
  }
  return h + '</div>';
}
function foroUserBar(){
  const u = Foro.user;
  if(u) return `<div class="fbar"><span>${avatar(u.username, u.avatar_url)} Conectado como <b>${esc(u.username)}</b> ${teamBadge(u.team_id)}</span><span class="sp"></span><a class="btn" href="#/foro/perfil" onclick="App.foroBack()">Mi perfil</a><button class="btn" onclick="App.foroLogout()">Salir</button></div>`;

}
function composer(forum, threadId, after, placeholder){
  if(!Foro.user) return `<div class="empty" style="padding:14px"><a class="btn on" href="#/foro/entrar" onclick="App.foroBack()">Entrá</a> o <a class="btn" href="#/foro/registro" onclick="App.foroBack()">creá una cuenta</a> para escribir.</div>`;

async function loadMine(sb, posts){
  Foro.mine = {};
  posts.forEach(p => Foro.cache.set(p.id, {username: p.profiles?.username || '', body: p.body}));
  if(!Foro.user || !posts.length) return;
  try{
    const {data} = await Foro.q(sb.from('reactions').select('post_id,value').eq('user_id', Foro.user.id).in('post_id', posts.map(p => p.id)));
    arr(data).forEach(r => { Foro.mine[r.post_id] = r.value; });
  }catch(e){}
}

/* Cuerpo de un foro (general o de franquicia): solapas + contenido */
async function forumBody(sb, fc, r, ctx){
  const inner = await forumInner(sb, fc, r);
  Foro.current = {fc, r: {...r}, inner};
  return `<div id="foroBox">${inner}</div>`;
}
/* Refresco del muro: reemplaza solo el contenido del foro, y solo si cambió (sin parpadeo ni saltos) */
async function refreshForoBox(){
  const cur = Foro.current, box = $('#foroBox');
  if(!cur || !box || !Foro.sb) return;
  const id = state.renderId;
  try{
    const inner = await forumInner(Foro.sb, cur.fc, cur.r);
    if(id !== state.renderId || Foro.current !== cur || inner === cur.inner) return;
    const ta = $('#foText');
    if(ta && (ta.value || document.activeElement === ta)) return;
    cur.inner = inner;
    const b = $('#foroBox'); if(b) b.innerHTML = inner;
  }catch(e){}
}
/* Recarga solo el foro (sin blanquear la página ni volver a pedir ESPN) y, si hace falta, cambia la dirección sin disparar route() */
async function foroReload(after){
  const cur = Foro.current;
  if(!cur || !$('#foroBox') || !Foro.sb) return false;
  if(after && after !== location.hash){
    if(!after.startsWith(cur.fc.base)) return false;
    history.pushState(null, '', after);
  }
  const r = parseHash(); state.route = r;
  const inner = await forumInner(Foro.sb, cur.fc, r);
  Foro.current = {fc: cur.fc, r: {...r}, inner};
  const b = $('#foroBox'); if(b) b.innerHTML = inner;
  return true;
}
async function forumInner(sb, fc, r){
  const sub = r.fsub || 'muro';
  const rk = fc.forum === 'general';   // los rankings son globales: solo en el Foro General
  const isRk = sub === 'rankings' && rk;
  // Compu: una solapa "Foro" con mensajes y temas uno al lado del otro. Celular: solapas separadas "Mensajes" y "Temas".
  const temasOn = ['temas', 't', 'nuevo'].includes(sub);
  const tabs = `<div class="ftabs"><a class="tab dsk ${isRk ? '' : 'on'}" href="${fc.base}">💬 Foro</a><a class="tab mob ${!isRk && !temasOn ? 'on' : ''}" href="${fc.base}">💬 Mensajes</a><a class="tab mob ${temasOn ? 'on' : ''}" href="${fc.base}/temas">📋 Temas</a>${rk ? `<a class="tab ${isRk ? 'on' : ''}" href="${fc.base}/rankings">🏆 Rankings</a>` : ''}</div>`;
  if(isRk) return foroUserBar() + tabs + await foroRankings(sb, fc, r);
  // Dos columnas: a la izquierda el muro (o el tema abierto / el formulario de tema nuevo), a la derecha la lista de temas
  const reading = sub === 't' || sub === 'nuevo';
  const [main, side] = await Promise.all([
    sub === 't' ? foroThread(sb, fc, r) : sub === 'nuevo' ? foroNewTopic(fc) : foroWall(sb, fc, sub === 'temas' ? {...r, page: 1} : r),
    foroTopicsSide(sb, fc, sub === 'temas' ? Math.max(1, r.page || 1) : 1, sub === 't' ? num(r.id) : null),
  ]);
  const v = reading ? 'v-leer' : sub === 'temas' ? 'v-temas' : 'v-muro';
  return foroUserBar() + tabs + `<div class="fgrid ${v}${reading ? ' reading' : ''}"><div class="fmain">${main}</div><aside class="fside">${side}</aside></div>`;
}

/* Columna de temas (derecha): los más activos primero, con el botón para abrir uno nuevo */
async function foroTopicsSide(sb, fc, page, cur){
  const from = (page - 1) * THREADS_SIDE;
  const {data, count} = await Foro.q(sb.from('threads').select('id,title,last_post_at,post_count,profiles!threads_author_fkey(username,team_id)', {count: 'exact'})
    .eq('forum', fc.forum).order('last_post_at', {ascending: false}).range(from, from + THREADS_SIDE - 1));
  const list = arr(data);
  const rows = list.map(t => { const n = Math.max(0, (t.post_count || 1) - 1);
    return `<a class="ftr${cur === t.id ? ' on' : ''}" href="${fc.base}/t/${t.id}"><b>${esc(t.title)}</b><small>por ${esc(t.profiles?.username || '—')} · ${pluralize(n, 'respuesta', 'respuestas')} · ${esc(timeAgo(t.last_post_at))}</small></a>`; }).join('');
  return `<div class="ph ftph">📋 Temas <span class="cnt">· ${pluralize(count || 0, 'tema', 'temas')}</span></div>
    <div class="box ftl"><div class="ftnew"><a class="btn on" href="${fc.base}/nuevo">＋ Nuevo tema</a></div>
      ${rows || '<div class="empty"><b>Todavía no hay temas</b>Abrí el primero.</div>'}
</div>
    ${pager(fc.base + '/temas', page, count, THREADS_SIDE)}`;
}

async function foroWall(sb, fc, r){
  const page = Math.max(1, r.page || 1), from = (page - 1) * WALL_PER_PAGE;
  const {data, count} = await Foro.q(sb.from('posts').select(POST_SEL, {count: 'exact'}).eq('forum', fc.forum).is('thread_id', null).order('id', {ascending: false}).range(from, from + WALL_PER_PAGE - 1));
  const posts = arr(data);
  await loadMine(sb, posts);
  return `<div class="ph">Mensajes · ${esc(fc.name)} <span class="cnt">· ${pluralize(count || 0, 'mensaje', 'mensajes')} · se actualiza solo</span></div>
    <div class="box">${page === 1 ? composer(fc.forum, null, fc.base, 'Escribí un mensaje…') : ''}${posts.map(p => postHtml(p)).join('') || '<div class="empty"><b>Todavía no hay mensajes</b>Escribí el primero.</div>'}</div>
    ${pager(fc.base + '/muro', page, count, WALL_PER_PAGE)}`;
}

async function foroTopics(sb, fc, r){
  const page = Math.max(1, r.page || 1), from = (page - 1) * THREADS_PER_PAGE;
  const {data, count} = await Foro.q(sb.from('threads').select('id,title,last_post_at,post_count,profiles!threads_author_fkey(username,team_id)', {count: 'exact'})
    .eq('forum', fc.forum).order('last_post_at', {ascending: false}).range(from, from + THREADS_PER_PAGE - 1));
  const rows = arr(data).map(t => `<tr><td class="l"><a href="${fc.base}/t/${t.id}"><b>${esc(t.title)}</b></a><div style="font-size:10px;color:var(--muted)">por ${esc(t.profiles?.username || '—')}</div></td>

    <div class="box tw">${rows ? `<table class="tbl"><thead><tr><th class="l">Tema</th><th>Respuestas</th><th class="hm">Último mensaje</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty"><b>Todavía no hay temas</b>Abrí el primero.</div>'}</div>
    ${pager(fc.base + '/temas', page, count, THREADS_PER_PAGE)}`;
}

async function foroThread(sb, fc, r){
  const id = num(r.id);
  const th = id ? await Foro.q(sb.from('threads').select('id,title,forum,post_count').eq('id', id).maybeSingle()) : {data: null};
  const t = th.data;
  if(!t) return emptyBox('Ese tema no existe', `<a class="btn" href="${fc.base}/temas">Volver a los temas</a>`);
  const total = t.post_count || 0;
  const pages = Math.max(1, Math.ceil(total / POSTS_PER_PAGE));
  const page = r.page === -1 ? pages : Math.min(Math.max(1, r.page || 1), pages);
  const from = (page - 1) * POSTS_PER_PAGE;
  const {data, count} = await Foro.q(sb.from('posts').select(POST_SEL, {count: 'exact'}).eq('thread_id', id).order('id', {ascending: true}).range(from, from + POSTS_PER_PAGE - 1));
  const posts = arr(data);
  await loadMine(sb, posts);
  const base = `${fc.base}/t/${id}`;
  return `<div class="crumb"><a href="${fc.base}/temas">Temas</a> › ${esc(t.title)}</div>
    <div class="ph">${esc(t.title)} <span class="cnt">· ${pluralize(count || total, 'mensaje', 'mensajes')}</span></div>
    <div class="box">${posts.map((p, i) => postHtml(p, from + i + 1)).join('') || '<div class="empty">Sin mensajes.</div>'}</div>${pager(base, page, count || total, POSTS_PER_PAGE)}
    <div class="ph">Responder</div><div class="box">${composer(t.forum, id, base + '/-1', 'Escribí tu respuesta…')}</div>`;
}

/* Rankings: hinchas por franquicia y actividad (mensajes) por hinchada + usuarios más activos */
async function foroRankings(sb, fc, r){
  await teamsOf(LG.nfl).catch(() => {});
  const mode = r.rank === 'actividad' ? 'actividad' : 'equipos';
  const sw = `<div class="btnrow"><a class="btn ${mode === 'equipos' ? 'on' : ''}" href="${fc.base}/rankings">Por equipo</a><a class="btn ${mode === 'actividad' ? 'on' : ''}" href="${fc.base}/rankings/actividad">Por actividad</a></div>`;
  const teamCell = id => { const t = nflTeam(id) || {id, displayName: 'Equipo ' + id}; return `<a class="tmc" href="#/nfl/team/${esc(id)}/foro">${logo(t)}<span>${esc(t.displayName || tName(t))}</span></a>`; };
  const bar = (v, max, id) => { const t = nflTeam(id); const c = teamColor(t), c2 = hexOk(t?.alternateColor) || '#c7ccd4'; return `<div class="rkbar"><i style="width:${max ? Math.max(3, v / max * 100).toFixed(1) : 0}%;background:linear-gradient(90deg,${c},${c} 70%,${c2})"></i></div>`; };
  const medal = i => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
  if(mode === 'equipos'){
    const {data} = await Foro.q(sb.rpc('ranking_hinchas'));
    const counts = Object.fromEntries(arr(data).map(x => [String(x.team_id), +x.fans || 0]));
    const ids = Object.keys(LG.nfl.teamIdx || {}).length ? Object.keys(LG.nfl.teamIdx) : Object.keys(counts);
    const rows = [...new Set(ids.concat(Object.keys(counts)))].map(id => ({id, n: counts[id] || 0}))
      .sort((a, b) => b.n - a.n || (nflTeam(a.id)?.displayName || '').localeCompare(nflTeam(b.id)?.displayName || ''));
    const max = rows[0]?.n || 0, total = rows.reduce((a, x) => a + x.n, 0);
    const body = rows.map((x, i) => `<tr class="${i < 3 && x.n ? 'top' : ''}"><td class="pos">${x.n ? medal(i) : '–'}</td><td class="l">${teamCell(x.id)}</td><td class="rkn"><b>${x.n}</b></td><td class="l rkc">${bar(x.n, max, x.id)}</td></tr>`).join('');
    return sw + `<div class="ph">🏆 Hinchadas · cantidad de hinchas <span class="cnt">· ${pluralize(total, 'hincha registrado', 'hinchas registrados')}</span></div>
      <div class="box tw"><table class="tbl rk"><thead><tr><th>#</th><th class="l">Franquicia</th><th>Hinchas</th><th class="l rkc"></th></tr></thead><tbody>${body}</tbody></table></div>
      <div class="legend">Cuenta a los usuarios del foro según la franquicia elegida en su perfil. ${Foro.user ? '<a href="#/foro/perfil" onclick="App.foroBack()">Cambiar la mía</a>' : '<a href="#/foro/registro" onclick="App.foroBack()">Sumate a tu hinchada</a>'}</div>`;
  }
  const [act, usr] = await Promise.all([Foro.q(sb.rpc('ranking_actividad')), Foro.q(sb.rpc('ranking_usuarios', {p_limit: 10}))]);
  const rows = arr(act.data).map(x => ({id: String(x.team_id), posts: +x.posts || 0, autores: +x.autores || 0, likes: +x.likes || 0}));
  const max = rows[0]?.posts || 0;
  const tTeams = rows.map((x, i) => `<tr class="${i < 3 ? 'top' : ''}"><td class="pos">${medal(i)}</td><td class="l">${teamCell(x.id)}</td><td class="rkn"><b>${x.posts}</b></td><td class="hm">${x.autores}</td><td class="hm">👍 ${x.likes}</td><td class="l rkc">${bar(x.posts, max, x.id)}</td></tr>`).join('');
  const tUsers = arr(usr.data).map((u, i) => `<tr class="${i < 3 ? 'top' : ''}"><td class="pos">${medal(i)}</td><td class="l"><span class="tmc">${avatar(u.username, u.avatar_url)}<b>${esc(u.username)}</b>${teamBadge(u.team_id)}</span></td><td class="rkn"><b>${+u.posts || 0}</b></td><td>👍 ${+u.likes || 0}</td></tr>`).join('');
  return sw + `<div class="ph">🔥 Hinchada más activa · mensajes escritos</div>
    <div class="box tw">${tTeams ? `<table class="tbl rk"><thead><tr><th>#</th><th class="l">Franquicia</th><th>Mensajes</th><th class="hm">Hinchas activos</th><th class="hm">Likes</th><th class="l rkc"></th></tr></thead><tbody>${tTeams}</tbody></table>` : '<div class="empty"><b>Todavía no hay actividad</b>Cuando los hinchas escriban, su equipo aparece acá.</div>'}</div>
    <div class="ph">⭐ Usuarios más activos</div>
    <div class="box tw">${tUsers ? `<table class="tbl rk"><thead><tr><th>#</th><th class="l">Usuario</th><th>Mensajes</th><th>Likes</th></tr></thead><tbody>${tUsers}</tbody></table>` : '<div class="empty">Todavía nadie escribió.</div>'}</div>
    <div class="legend">Suma los mensajes del muro y de los temas de todos los foros. Los likes son los 👍 recibidos.</div>`;
}

const ForoActions = {
  _back: null,
  foroBack(){
    let h = location.hash;
    if(/^#\/foro\/(entrar|registro|perfil)/.test(h)) return;
    // Si el foro está embebido (Home o partido), volver directo al foro
    if($('#foroSec') && !/\/foro(\/|$)/.test(h)) h = (h && h !== '#/' ? h : '#/hoy').replace(/\/$/, '') + '/foro';
    ForoActions._back = h;
  },
  foroEmo(){ const p = $('#foEmo'); if(p) p.hidden = !p.hidden; },
  /* Imágenes: se eligen con el botón o se pegan en el cuadro de texto; se achican en el navegador y se suben a Supabase */
  foroImgPick(input){ const f = input.files && input.files[0]; input.value = ''; if(f) ForoActions.foroImgFile(f); },
  foroPaste(ev){
    const it = [...(ev.clipboardData?.items || [])].find(i => i.kind === 'file' && /^image\//.test(i.type));
    if(!it) return;
    ev.preventDefault(); ForoActions.foroImgFile(it.getAsFile());
  },
  async foroImgFile(file){
    const msg = $('#foMsg'), ta = $('#foText'), say = t => { if(msg){ msg.style.color = ''; msg.textContent = t; } };
    if(!ta || !file) return;
    if(!Foro.user){ ForoActions.foroBack(); go('#/foro/entrar'); return; }
    if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){ say('Elegí una imagen JPG, PNG, WEBP o GIF.'); return; }
    if((ta.value.match(/\[img\]/g) || []).length >= FORO_IMG_MAX){ say(`Hasta ${FORO_IMG_MAX} imágenes por mensaje.`); return; }
    if(ForoActions._uploading){ say('Esperá que termine de subir la anterior…'); return; }
    ForoActions._uploading = true; say('Subiendo imagen…');
    try{
      let blob = file, ext = 'gif';
      if(file.type === 'image/gif'){ if(file.size > FORO_IMG_BYTES) throw new Error('el GIF pesa más de 1 MB.'); }
      else { blob = await shrinkJpeg(file, 1280); ext = 'jpg'; }
      const sb = await Foro.client();
      const path = `${Foro.user.id}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const up = await sb.storage.from(FORO_IMG_BUCKET).upload(path, blob, {contentType: blob.type || 'image/jpeg', cacheControl: '31536000', upsert: false});
      if(up.error) throw up.error;
      const url = sb.storage.from(FORO_IMG_BUCKET).getPublicUrl(path).data.publicUrl.split('?')[0];
      const pre = ta.value && !/\n$/.test(ta.value.slice(0, ta.selectionStart ?? ta.value.length)) ? '\n' : '';
      ForoActions.foroIns(`${pre}[img]${url}[/img]\n`);
      say('');
    }catch(e){ say('No se pudo subir la imagen: ' + foroErr(e)); }
    finally{ ForoActions._uploading = false; }
  },
  // Ver la imagen grande sin salir de la página (tocar afuera o Esc para cerrar)
  foroImgOpen(a){
    const d = document.createElement('div'); d.className = 'flbx'; d.setAttribute('role', 'dialog');
    d.innerHTML = `<img src="${esc(a.getAttribute('href'))}" alt="Imagen del mensaje"><span class="flbx-x">✕</span>`;
    const close = () => { d.remove(); document.removeEventListener('keydown', key); };
    const key = e => { if(e.key === 'Escape') close(); };
    d.onclick = close; document.addEventListener('keydown', key);
    document.body.appendChild(d);
    return false;
  },
  foroIns(txt){
    const ta = $('#foText'); if(!ta) return;
    const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? ta.value.length;
    ta.value = ta.value.slice(0, a) + txt + ta.value.slice(b);
    ta.focus(); ta.selectionStart = ta.selectionEnd = a + txt.length;
  },
  foroQuote(id){
    if(!Foro.user){ ForoActions.foroBack(); go('#/foro/entrar'); return; }
    const p = Foro.cache.get(id); const ta = $('#foText');
    if(!p || !ta) return;
    const own = String(p.body).replace(/\[quote=[^\]]*\][\s\S]*?\[\/quote\]\s*/g, '').replace(/\[img\][\s\S]*?\[\/img\]/g, '(imagen)').trim().slice(0, 600);
    ForoActions.foroIns(`[quote=${p.username || 'alguien'}]${own}[/quote]\n`);
    ta.scrollIntoView({block: 'center'});
  },
  async foroReact(id, v){
    if(!Foro.user){ ForoActions.foroBack(); go('#/foro/entrar'); return; }
    try{
      const sb = await Foro.client();
      if(Foro.mine[id] === v) await Foro.q(sb.from('reactions').delete().eq('post_id', id).eq('user_id', Foro.user.id));
      else await Foro.q(sb.from('reactions').upsert({post_id: id, user_id: Foro.user.id, value: v}, {onConflict: 'post_id,user_id'}));
      if(!(await foroReload().catch(() => false))) route(true);
    }catch(e){ alertBox(e.message); }
  },
  async foroAuth(ev, reg){
    ev.preventDefault();
    const f = ev.target, msg = $('#foMsg', f), btn = f.querySelector('button[type=submit]');
    const pass = $('#foPass', f).value;
    const user = reg ? $('#foUser', f).value.trim() : '';
    const mail = reg ? $('#foMail', f).value.trim() : '';
    const login = reg ? '' : $('#foLogin', f).value.trim();
    if(reg && !/^[A-Za-z0-9_]{3,20}$/.test(user)){ msg.textContent = 'El usuario debe tener de 3 a 20 caracteres: letras, números o guion bajo.'; return; }
    if(pass.length < 6){ msg.textContent = 'La contraseña debe tener al menos 6 caracteres.'; return; }
    if(reg && pass !== $('#foPass2', f).value){ msg.textContent = 'Las contraseñas no coinciden.'; return; }
    btn.disabled = true; msg.textContent = '';
    try{
      const sb = await Foro.client();
      let res;
      if(reg){
        if(mail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) throw new Error('invalid format');
        const taken = await Foro.q(sb.from('profiles').select('id').ilike('username', user.replace(/_/g, '\\_')).limit(1));
        if(arr(taken.data).length) throw new Error('duplicate key');
        if(mail){ const used = await Foro.q(sb.rpc('login_email', {p_login: mail})); if(used.data) throw new Error('already registered'); }
        res = await sb.auth.signUp({email: user.toLowerCase() + FORO_MAIL, password: pass, options: {data: {username: user, team_id: $('#foTeam', f).value || '', contact_email: mail}}});
        if(!res.error && !res.data?.session) throw new Error('email not confirmed');
      } else {
        // Usuario o mail → mail interno de la cuenta
        const {data: internal} = await Foro.q(sb.rpc('login_email', {p_login: login}));
        if(!internal) throw new Error('Invalid login credentials');
        res = await sb.auth.signInWithPassword({email: internal, password: pass});
      }
      if(res.error) throw res.error;
      await Foro.loadProfile(res.data.session);
      const back = ForoActions._back; ForoActions._back = null;
      go(back || '#/foro');
      Notif.refresh();
    }catch(e){ msg.textContent = foroErr(e); btn.disabled = false; }
  },
  async foroAvatar(input){
    const file = input.files && input.files[0], msg = $('#foPicMsg');
    if(!file) return;
    if(!/^image\//.test(file.type)){ msg.textContent = 'Elegí una imagen.'; return; }
    msg.style.color = 'var(--muted)'; msg.textContent = 'Subiendo foto…';
    try{
      const blob = await squareJpeg(file, 160);
      const sb = await Foro.client();
      const path = `${Foro.user.id}/avatar.jpg`;
      const up = await sb.storage.from('avatars').upload(path, blob, {upsert: true, contentType: 'image/jpeg', cacheControl: '3600'});
      if(up.error) throw up.error;
      const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl.split('?')[0] + '?v=' + Date.now();
      await Foro.q(sb.from('profiles').update({avatar_url: url}).eq('id', Foro.user.id));
      Foro.user.avatar_url = url;
      route(true);
    }catch(e){ msg.style.color = ''; msg.textContent = 'No se pudo subir la foto: ' + (e.message || e); }
    input.value = '';
  },
  async foroAvatarRemove(){
    try{
      const sb = await Foro.client();
      await Foro.q(sb.from('profiles').update({avatar_url: null}).eq('id', Foro.user.id));
      sb.storage.from('avatars').remove([`${Foro.user.id}/avatar.jpg`]).catch(() => {});
      Foro.user.avatar_url = null;
      route(true);
    }catch(e){ alertBox(e.message); }
  },
  async foroSaveProfile(ev){
    ev.preventDefault();
    const f = ev.target, msg = $('#foMsg', f);
    try{
      const sb = await Foro.client();
      const team = $('#foTeam', f).value || null;
      await Foro.q(sb.from('profiles').update({team_id: team}).eq('id', Foro.user.id));
      Foro.user.team_id = team;
      msg.style.color = 'var(--win)'; msg.textContent = 'Guardado.';
    }catch(e){ msg.style.color = ''; msg.textContent = e.message; }
  },
  async foroLogout(){
    try{ const sb = await Foro.client(); await sb.auth.signOut(); }catch(e){}
    Foro.user = null; Notif.refresh(); route();
  },
  async foroSend(ev, forum, threadId, after){
    ev.preventDefault();
    const f = ev.target, msg = $('#foMsg', f), btn = f.querySelector('button[type=submit]');
    const body = $('#foText', f).value.trim();
    if(!body){ msg.textContent = 'El mensaje está vacío.'; return; }
    btn.disabled = true; msg.textContent = 'Publicando…';
    try{
      const sb = await Foro.client();
      await Foro.q(sb.from('posts').insert({forum, thread_id: threadId, body, author: Foro.user.id}));
      $('#foText', f).value = '';
      if(!(await foroReload(after).catch(() => false))) go(after);
    }catch(e){ msg.textContent = e.message; btn.disabled = false; }
  },
  async foroCreate(ev, forum, base){
    ev.preventDefault();
    const f = ev.target, msg = $('#foMsg', f), btn = f.querySelector('button[type=submit]');
    const title = $('#foTitle', f).value.trim(), body = $('#foText', f).value.trim();
    if(title.length < 3){ msg.textContent = 'El título es muy corto.'; return; }
    if(!body){ msg.textContent = 'El mensaje está vacío.'; return; }
    btn.disabled = true; msg.textContent = 'Publicando…';
    try{
      const sb = await Foro.client();
      const {data} = await Foro.q(sb.rpc('create_thread', {p_forum: forum, p_title: title, p_body: body}));
      if(!(await foroReload(`${base}/t/${data}`).catch(() => false))) go(`${base}/t/${data}`);
    }catch(e){ msg.textContent = e.message; btn.disabled = false; }
  },
};

const Notif = {
  items: [], unread: 0, last: 0, baseTitle: document.title,
  async refresh(){
    if(!Foro.configured()) return;
    let sb; try{ sb = await Foro.client(); }catch(e){ return; }
    if(!Foro.user){ this.items = []; this.unread = 0; this.render(); return; }
    try{
      const [list, cnt] = await Promise.all([
        Foro.q(sb.from('notifications').select('id,kind,read,created_at,forum,thread_id,actor:profiles!notifications_actor_fkey(username,avatar_url),threads!notifications_thread_id_fkey(title)')
          .eq('user_id', Foro.user.id).order('id', {ascending: false}).limit(20)),
        Foro.q(sb.from('notifications').select('id', {count: 'exact', head: true}).eq('user_id', Foro.user.id).eq('read', false)),
      ]);
      this.items = arr(list.data); this.unread = cnt.count || 0; this.last = Date.now();
    }catch(e){ console.warn('notificaciones', e); }
    this.render();
  },
  href(n){ const b = forumHref(n.forum); return n.thread_id ? `${b}/t/${n.thread_id}/-1` : b; },
  text(n){
    const t = n.threads?.title ? `«${esc(n.threads.title)}»` : '';
    if(n.kind === 'reply') return `respondió en tu tema ${t}`;
    return `te citó en ${t || esc(forumLabel(n.forum))}`;
  },
  html(){
    if(!Foro.user) return `<div class="ph sm">Notificaciones</div><div class="nempty">Entrá al foro para que te avisemos cuando te respondan o te citen.
      <div class="btnrow"><a class="btn on" href="#/foro/entrar" onclick="App.foroBack();App.notifClose()">Entrar</a><a class="btn" href="#/foro/registro" onclick="App.foroBack();App.notifClose()">Crear cuenta</a></div></div>`;
    const head = `<div class="ph sm">Notificaciones${this.unread ? ` <span class="cnt">· ${this.unread} sin leer</span>` : ''}${this.unread ? '<button type="button" onclick="App.notifReadAll()">Marcar todo leído</button>' : ''}</div>`;
    if(!this.items.length) return head + '<div class="nempty">Todavía no tenés notificaciones. Te avisamos acá cuando alguien te responda o te cite.</div>';
    return head + '<div class="nlist">' + this.items.map(n => {
      const who = n.actor?.username || 'Alguien';
      return `<a class="nitem ${n.read ? '' : 'new'}" href="${this.href(n)}" onclick="App.notifOpen(event,${n.id},'${this.href(n)}')">${avatar(who, n.actor?.avatar_url)}<div><b>${esc(who)}</b> ${this.text(n)}<small>${esc(timeAgo(n.created_at))}</small></div></a>`;
    }).join('') + '</div>';
  },
  render(){
    const badge = $('#nbadge'), bell = $('#bell'), panel = $('#npanel');
    if(!badge) return;
    badge.hidden = !this.unread; badge.textContent = this.unread > 99 ? '99+' : String(this.unread);
    bell.classList.toggle('on', !!this.unread);
    bell.setAttribute('aria-label', this.unread ? `Notificaciones: ${this.unread} sin leer` : 'Notificaciones');
    document.title = (this.unread ? `(${this.unread}) ` : '') + this.baseTitle;
    if(!panel.hidden) panel.innerHTML = this.html();
  },
};
const NotifActions = {
  notifToggle(ev){
    ev?.stopPropagation();
    const panel = $('#npanel'), bell = $('#bell');
    panel.hidden = !panel.hidden; bell.setAttribute('aria-expanded', String(!panel.hidden));
    if(!panel.hidden){
      panel.innerHTML = Foro.configured() ? Notif.html() : '<div class="ph sm">Notificaciones</div><div class="nempty">El foro todavía no está conectado.</div>';
      if(Date.now() - Notif.last > 15e3) Notif.refresh();
