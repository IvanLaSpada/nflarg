  if(!pre && (A.lines.length || H.lines.length)){

    const tr = c => `<tr><td class="l"><span class="tmc">${logo(c.team)} <b>${esc(tAbbr(c.team))}</b></span></td>${Array.from({length: nq}, (_, i) => `<td>${esc(c.lines[i] ?? '-')}</td>`).join('')}<td class="t">${esc(c.score ?? '-')}</td></tr>`;
    html += `<div class="star-sep"><span>Marcador</span></div><div class="box tw" style="border-top:1px solid #9aa7bd"><table class="tbl ls"><thead><tr><th class="l">Equipo</th>${ths}<th class="t">T</th></tr></thead><tbody>${tr(A)}${tr(H)}</tbody></table></div>`;
  }

  // Líderes del partido
  const L = arr(d.leaders);
  if(L.length){
    const findTeam = c => L.find(x => String(x.team?.id) === c.id) || null;
    const la = findTeam(A) || L[0], lh = findTeam(H) || L[1];
    const want = ['passingYards', 'rushingYards', 'receivingYards'];
    const catsA = arr(la?.leaders), catsH = arr(lh?.leaders);
    let names = want.filter(n => catsA.some(c => c.name === n) || catsH.some(c => c.name === n));
    if(!names.length) names = [...new Set(catsA.concat(catsH).map(c => c.name))].slice(0, 3);
    const cell = (cats, n, t) => {
      const c = cats.find(x => x.name === n); const l = arr(c?.leaders)[0];
      if(!l) return '<div><span class="who" style="color:#999">—</span></div>';
      const a = l.athlete || {};
      return `<div>${headshot(a.headshot?.href, 'hs', a.displayName)}<div class="who">${a.id ? `<a href="#/${lg.key}/player/${a.id}">${esc(a.displayName || a.shortName)}</a>` : esc(a.displayName || '')} <small style="color:#888">${esc(a.position?.abbreviation || '')} · ${esc(tAbbr(t))}</small><span>${esc(l.displayValue || '')}</span></div></div>`;
    };
    const titles = {passingYards: 'Pases', rushingYards: 'Carreras', receivingYards: 'Recepciones'};
    const rows = names.map(n => {

      return `<div class="gl"><div class="cat">${esc(titles[n] || c?.displayName || n)}</div>${cell(catsA, n, A.team)}${cell(catsH, n, H.team)}</div>`;
    }).join('');
    if(rows) html += `<div class="star-sep"><span>Líderes${pre ? ' de la temporada' : ' del partido'}</span></div><div class="box" style="border-top:1px solid #9aa7bd">${rows}</div>`;

      if(q !== last){ rows += `<div class="dayh">${q <= 4 ? q + 'º cuarto' : 'Tiempo extra'}</div>`; last = q; }
      const ab = (p.scoringType?.abbreviation || p.type?.abbreviation || '').toUpperCase();
      const tm = p.team || {};
      const t = (String(tm.id) === A.id ? A.team : String(tm.id) === H.id ? H.team : tm);
      rows += `<div class="sp-row"><span class="sp-q">${esc(p.clock?.displayValue || '')}</span><span class="sp-type ${esc(ab)}">${esc(ab || '•')}</span><span class="tmc" style="display:flex;gap:6px;align-items:center">${logo(t)}<span>${esc(p.text || '')}</span></span><span class="sp-sc">${esc(p.awayScore ?? '')}-${esc(p.homeScore ?? '')}</span></div>`;
    }
    html += `<div class="star-sep"><span>Jugadas de anotación</span></div><div class="box" style="border-top:1px solid #9aa7bd">${rows}</div>`;
  }

  // Box score por equipo (estadísticas de equipo)
  const BT = arr(d.boxscore?.teams);
  if(BT.length >= 2 && BT.some(t => arr(t.statistics).length)){
    const ba = BT.find(t => String(t.team?.id) === A.id) || BT[0], bh = BT.find(t => String(t.team?.id) === H.id) || BT[1];
    const statsH = arr(bh.statistics);
    const rows = arr(ba.statistics).map(sa => {
      const sh = statsH.find(x => x.name === sa.name) || {};
      const va = numVal(sa.displayValue), vh = numVal(sh.displayValue);
      const lowerBetter = /turnover|penalt|fumblesLost|interceptions|sacksYardsLost/i.test(sa.name || '');
      const tot = va + vh;
      const bar = (!isNaN(tot) && tot > 0) ? `<div class="bars"><i style="width:${(va / tot * 100).toFixed(1)}%;background:${teamColor(A.team)}"></i><i style="width:${(vh / tot * 100).toFixed(1)}%;background:${teamColor(H.team)}"></i></div>` : '';

  // Box score individual
  const BP = arr(d.boxscore?.players);
  if(BP.length){
    const pa = BP.find(p => String(p.team?.id) === A.id) || BP[0], ph = BP.find(p => String(p.team?.id) === H.id) || BP[1];
    const order = [...new Set(arr(pa?.statistics).concat(arr(ph?.statistics)).map(c => c.name))];
    const tbl = (P, c) => {
      const cat = arr(P?.statistics).find(x => x.name === c);
      if(!cat || !arr(cat.athletes).length) return '';
      const t = P.team || {};
      const labels = arr(cat.labels);
      const rows = arr(cat.athletes).map(a => `<tr><td class="l">${a.athlete?.id ? `<a href="#/${lg.key}/player/${a.athlete.id}">${esc(a.athlete.displayName || a.athlete.shortName)}</a>` : esc(a.athlete?.displayName || '')}</td>${arr(a.stats).map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('');
      const tot = arr(cat.totals).length ? `<tr class="tot"><td class="l">Total</td>${arr(cat.totals).map(x => `<td>${esc(x)}</td>`).join('')}</tr>` : '';
      return `<div><div class="bx-team" style="--tc:${teamColor(t)}">${logo(t)} ${esc(t.displayName || tName(t))}</div><div class="tw"><table class="tbl"><thead><tr><th class="l">Jugador</th>${labels.map(x => `<th title="${esc(x)}">${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows}${tot}</tbody></table></div></div>`;
    };
    const sects = order.map(c => {
      const a = tbl(pa, c), h = tbl(ph, c);
      if(!a && !h) return '';
      return `<div class="sect"><div class="ph">${esc(BOX_ES[c] || c)}</div><div class="box"><div class="boxgrid">${a}${h}</div></div></div>`;
    }).join('');
    if(sects) html += `<div class="star-sep"><span>Box score</span></div>${sects}`;
  }

  // Info del partido
  const gi = d.gameInfo || {};
  const odds = arr(d.pickcenter)[0] || arr(hc.odds)[0];
  const kv = [];
  if(vtxt) kv.push(['Estadio', vtxt]);
  kv.push(['Fecha', `${fmtLong(g.date)} · ${fmtTime(g.date)}`]);
  if(g.tv) kv.push(['TV EE.UU.', g.tv]);
  if(g.tvAR) kv.push(['TV Argentina', (g.tvARlong || g.tvAR) + ' (estimado)']);
  if(gi.attendance) kv.push(['Asistencia', Number(gi.attendance).toLocaleString('es-AR')]);
  if(gi.weather) kv.push(['Clima', [gi.weather.displayValue, gi.weather.temperature != null ? gi.weather.temperature + '°F (' + Math.round((gi.weather.temperature - 32) * 5 / 9) + '°C)' : ''].filter(Boolean).join(' · ')]);
  if(odds?.details) kv.push(['Línea', odds.details + (odds.overUnder ? ` · O/U ${odds.overUnder}` : '')]);
  if(pre && !L.length && !SP.length) html += emptyBox('El partido todavía no comenzó', 'Las estadísticas aparecerán cuando arranque.');
  html += `<div class="star-sep"><span>Info</span></div><div class="box" style="border-top:1px solid #9aa7bd"><dl class="kv">${kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`;

  // Foro General (el mismo de la sección Foro), embebido abajo del partido
  let foro;
  try{
    foro = Foro.configured()
      ? await forumBody(await Foro.client(), {forum: 'general', base: `#/${r.lg}/game/${r.id}/foro`, name: 'Foro General'}, r, ctx)
      : foroSetup();
  }catch(e){ foro = errorBox(e, 'No se pudo cargar el foro'); }
  html += `<div class="star-sep" id="foroSec"><span>Foro General</span></div>${foro}`;
  paint(ctx, el, html);
  if(r.foroLink && !ctx.silent && alive(ctx)) $('#foroSec')?.scrollIntoView({block: 'start'});
};

async function teamInfo(lg, id, season){
  try{ const td = await getSite(`${SITE}/${lg.slug}/teams/${encodeURIComponent(id)}`); if(td.team?.id) return td.team; }catch(e){}
  for(const y of [season, curSeason(lg)]){
    try{ const t = await API.get(`${CORE}/${lg.slug}/seasons/${y}/teams/${encodeURIComponent(id)}`, {ttl: LONG_TTL}); if(t?.id) return t; }catch(e){}

}

    <div class="tabs">${tabs.map(([k, n]) => `<a class="tab ${k === r.tab ? 'on' : ''}" href="#/${lg.key}/team/${r.id}/${k}${k === 'foro' ? '' : '/' + season}">${n}</a>`).join('')}</div>`;

async function fetchRoster(lg, id, season){
  const q = season ? '?season=' + season : '';
  try{ return await getSite(`${SITE}/${lg.slug}/teams/${id}/roster${q}`); }catch(e){}
  try{
    const d = await getSite(`${SITE}/${lg.slug}/teams/${id}?enable=roster${season ? '&season=' + season : ''}`);
    if(arr(d.team?.athletes).length) return {athletes: d.team.athletes, coach: d.team.coach};
  }catch(e){}
  return coreRoster(lg, id, season || curSeason(lg));
}
/* Plantel desde la API core (referencias $ref resueltas en paralelo) */
async function coreRoster(lg, id, season){
  const d = await API.get(`${CORE}/${lg.slug}/seasons/${season}/teams/${id}/athletes?limit=300`, {ttl: LONG_TTL});
  const refs = arr(d.items).map(i => i.$ref).filter(Boolean);
  if(!refs.length) return {athletes: []};
  const aths = (await pool(refs, 12, u => API.get(u, {ttl: LONG_TTL}))).filter(a => a && a.id);
  const colRefs = [...new Set(aths.map(a => a.college?.$ref).filter(Boolean))];
  const cols = await pool(colRefs, 12, u => API.get(u, {ttl: LONG_TTL}));
  const cmap = Object.fromEntries(colRefs.map((u, i) => [u, cols[i]]));
  return {athletes: aths.map(a => {
    const c = a.college?.$ref ? cmap[a.college.$ref] : a.college;
    return {...a, college: c ? {name: c.name || c.displayName || c.shortDisplayName} : null};
  })};
}
/* Fixture armado desde los scoreboards semanales (cuando /schedule no responde) */
async function scheduleFromScoreboards(lg, id, season){
  const first = await API.get(sbUrl(lg, {dates: season, seasontype: 2, week: 1}));
  const cal = arr(arr(first.leagues)[0]?.calendar).filter(c => c && typeof c === 'object' && ['1', '2', '3'].includes(String(c.value)));
  const jobs = [];
  for(const c of cal) for(const e of arr(c.entries)) if(num(e.value)) jobs.push({t: num(c.value), w: num(e.value)});
  if(!jobs.length) for(let w = 1; w <= 18; w++) jobs.push({t: 2, w});
  const res = await pool(jobs, 6, j => API.get(sbUrl(lg, {dates: season, seasontype: j.t, week: j.w})).then(d => ({...j, d})));
  const mine = ev => arr(arr(ev.competitions)[0]?.competitors).some(c => String(c.id || c.team?.id) === String(id));
  const out = [1, 2, 3].map(t => ({t, d: {events: res.filter(x => x && x.t === t).flatMap(x => arr(x.d.events).filter(mine).map(ev => ({...ev, week: {...(ev.week || {}), number: x.w}})))}}));
  if(lg.key === 'nfl'){
    const played = new Set(out[1].d.events.map(ev => num(ev.week?.number)));
    const regWeeks = jobs.filter(j => j.t === 2 && res.some(x => x && x.t === 2 && x.w === j.w && arr(x.d.events).length)).map(j => j.w);
    const bye = regWeeks.find(w => !played.has(w));
    if(bye) out[1].d.byeWeek = bye;
  }
  return out;
}

      <td class="l"><a class="tmc" href="#/${lg.key}/player/${a.id}">${headshot(a.headshot?.href, 'hs', a.displayName)}<span>${esc(a.displayName || a.fullName || '')}</span></a></td>

      <td class="hm">${esc(a.experience?.years != null ? (a.experience.years === 0 ? 'R' : a.experience.years) : '-')}</td>
      <td class="l">${esc(a.college?.name || a.college?.shortName || '-')}</td></tr>`).join('');
    html += `<div class="sect"><div class="ph">${esc(SIDE_ES[gr.position] || cap(String(gr.position || 'Otros')))} <span class="cnt">· ${items.length} jugadores</span></div><div class="box tw roster"><table class="tbl"><thead><tr><th>#</th><th class="l">Jugador</th><th>Pos</th><th>Edad</th><th>Altura</th><th>Peso</th><th class="hm">Exp</th><th class="l">College</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  return html;
}

async function teamFixture(lg, id, season, ctx){
  let res = await Promise.all([1, 2, 3].map(t => getSite(`${SITE}/${lg.slug}/teams/${id}/schedule?season=${season}&seasontype=${t}`).then(d => ({t, d}), () => ({t, d: null}))));
  if(res.every(x => !arr(x.d?.events).length)){
    try{ res = await scheduleFromScoreboards(lg, id, season); }
    catch(e){ if(res.every(x => !x.d)) throw e; }
  }
  const seen = new Set();
  const byType = {};
  let bye = null;
  for(const {t, d} of res){
    if(!d) continue;
    if(t === 2 && d.byeWeek) bye = num(d.byeWeek);
    for(const ev of arr(d.events)){
      if(seen.has(ev.id)) continue; seen.add(ev.id);
      const g = normGame(ev, lg.key);
      const tt = g.stype || t;
      (byType[tt] = byType[tt] || []).push({g, ev});
    }
  }
  const types = Object.keys(byType).map(Number).sort();
  if(!types.length) return emptyBox('Sin partidos', `ESPN no devolvió partidos para ${season}.`);
  let live = false, html = '';
  for(const t of types){
    const list = byType[t].sort((a, b) => a.g.date - b.g.date);
    let rows = '', byeDone = false;
    for(const {g, ev} of list){
      if(g.state === 'in' || isSoon(g)) live = true;
      const wk = num(ev.week?.number);
      if(t === 2 && bye && !byeDone && wk && wk > bye){ rows += `<tr class="bye"><td>${bye}</td><td colspan="6" class="l">Semana libre (BYE)</td></tr>`; byeDone = true; }
      const me = g.home.id === String(id) ? g.home : g.away;
      const op = me === g.home ? g.away : g.home;
      const at = me === g.home ? 'vs' : '@';
      let result;
      if(g.state === 'post'){
        const ms = parseFloat(me.score), os = parseFloat(op.score);
        const R = me.win ? 'W' : op.win ? 'L' : (ms > os ? 'W' : ms < os ? 'L' : 'T');
        result = `<span class="res ${R}">${R === 'W' ? 'G' : R === 'L' ? 'P' : 'E'}</span><b>${esc(me.score ?? '-')}-${esc(op.score ?? '-')}</b>${g.period > 4 ? ' OT' : ''}`;
      } else {
        const s = statusInfo(g);
        result = g.state === 'in' ? `<span class="live">EN VIVO</span> <b>${esc(me.score ?? 0)}-${esc(op.score ?? 0)}</b>` : esc(s.txt);
      }
      const wlabel = ev.week?.text ? weekLabel(ev.week.text) : (wk ? wk : '-');
      rows += `<tr onclick="location.hash='#/${lg.key}/game/${esc(g.id)}'" style="cursor:pointer"><td>${esc(wlabel)}</td><td class="l">${esc(fmtShort(g.date))}</td>
        <td class="l"><span class="tmc"><span style="color:#888;width:16px">${at}</span>${logo(op.team)}<a href="#/${lg.key}/game/${esc(g.id)}">${esc(op.team.displayName || tName(op.team))}</a></span></td>
        <td class="l">${result}</td><td class="hm">${esc(g.tv || '')}</td><td class="hm">${esc(g.tvAR || '')}</td><td class="hm">${esc(me.record || '')}</td></tr>`;
    }
    html += `<div class="sect"><div class="ph">${esc(STYPE[t] || 'Partidos')} <span class="cnt">· ${list.length} partidos</span></div><div class="box tw"><table class="tbl"><thead><tr><th>Sem</th><th class="l">Fecha</th><th class="l">Rival</th><th class="l">Resultado</th><th class="hm">TV EE.UU.</th><th class="hm" title="${AR_TIP}">TV AR*</th><th class="hm">Récord</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  if(alive(ctx)) state.liveInView = live;
  return html;
}

function findCats(d){
  const direct = d?.results?.stats?.categories || d?.statistics?.splits?.categories || d?.splits?.categories || d?.results?.categories || d?.statistics?.categories;
  if(arr(direct).length) return arr(direct);
  let found = null;
  (function walk(o, depth){
    if(found || !o || typeof o !== 'object' || depth > 6) return;
    if(Array.isArray(o.categories) && o.categories.some(c => arr(c?.stats).length)){ found = o.categories; return; }
    for(const k in o) walk(o[k], depth + 1);
  })(d, 0);
  return arr(found);
}
async function teamStats(lg, id, season, isCur){
  let d = null, err = null, cats = [];
  try{ d = await getSite(`${SITE}/${lg.slug}/teams/${id}/statistics${isCur ? '' : '?season=' + season}`); cats = findCats(d).filter(c => arr(c.stats).length); }
  catch(e){ err = e; }
  if(!cats.length){
    try{ const c = await API.get(`${CORE}/${lg.slug}/seasons/${season}/types/2/teams/${id}/statistics`); cats = findCats(c).filter(x => arr(x.stats).length); }
    catch(e){ err = err || e; }
  }
  if(!cats.length && err && err.status !== 404 && !d) throw err;
  if(!cats.length) return emptyBox('Sin estadísticas', 'ESPN no devolvió estadísticas para este equipo.');
  const cards = cats.map(c => {
    const hasRank = c.stats.some(s => s.rankDisplayValue);
    const hasPG = c.stats.some(s => s.perGameDisplayValue);
    const rows = c.stats.map(s => `<tr><td class="l" title="${esc(s.description || '')}">${esc(s.displayName || s.shortDisplayName || s.name)}</td><td><b>${esc(s.displayValue ?? s.value ?? '-')}</b></td>${hasPG ? `<td>${esc(s.perGameDisplayValue ?? '-')}</td>` : ''}${hasRank ? `<td>${esc(s.rankDisplayValue ?? '-')}</td>` : ''}</tr>`).join('');
    return `<div><div class="ph">${esc(BOX_ES[c.name] || c.displayName || c.name)}</div><div class="box tw"><table class="tbl"><thead><tr><th class="l">Estadística</th><th>Total</th>${hasPG ? '<th>x Partido</th>' : ''}${hasRank ? '<th>Rank</th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('');
  return `<div class="grid2">${cards}</div>`;
}

  async q(promise){
    const {data, error, count} = await promise;
    if(error){ const e = new ApiError(foroErr(error), -1, ''); e.foro = true; throw e; }
    return {data, count};
  },
};

function foroErr(e){
  const m = String(e?.message || e || '');
  if(/does not exist|schema cache|could not find the (table|function)/i.test(m)) return 'La base del foro está desactualizada: volvé a ejecutar supabase/foro.sql completo en el SQL Editor de Supabase. (' + m + ')';
  if(/too_fast/i.test(m)) return 'Esperá unos segundos antes de volver a publicar.';
  if(/already registered|already been registered/i.test(m)) return 'Ese mail ya está registrado en otra cuenta.';
  if(/invalid login credentials/i.test(m)) return 'Usuario/mail o contraseña incorrectos.';
  if(/password should be|weak password|at least/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
  if(/database error saving new user|duplicate key/i.test(m)) return 'Ese nombre de usuario ya está en uso.';
  if(/invalid format/i.test(m)) return 'El mail no es válido.';
  if(/validate email|email address.*invalid/i.test(m)) return 'Supabase rechazó la cuenta interna del usuario (' + m + ').';
  if(/signups? not allowed|signup.*disabled/i.test(m)) return 'El registro está desactivado en la configuración de Supabase.';
  if(/email not confirmed/i.test(m)) return 'La cuenta quedó pendiente de confirmación: en Supabase hay que desactivar "Confirm email".';
  if(/rate limit|too many/i.test(m)) return 'Demasiados intentos seguidos. Esperá unos minutos y probá de nuevo.';
  if(/not_authenticated|JWT|row-level security/i.test(m)) return 'Tenés que entrar con tu usuario para hacer eso.';
  if(/failed to fetch|network/i.test(m)) return 'No se pudo conectar con el foro. Revisá tu conexión.';
  return m || 'Ocurrió un error en el foro.';
}
function timeAgo(iso){
  const d = new Date(iso); const s = (Date.now() - d) / 1000;
  if(isNaN(s)) return '';
  if(s < 60) return 'recién';
  if(s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if(s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  if(s < 7 * 86400) return `hace ${Math.floor(s / 86400)} d`;
  return fmtDate(d);
}
/* Avatar: la foto de perfil si hay; si no (o si no carga), la inicial sobre un color propio del usuario */
function avatar(name, url, cls = ''){
  const n = String(name || '?');
  let h = 0; for(const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const hue = h % 360;
  const img = /^https:\/\/[a-z0-9-]+\.supabase\.co\/storage\/|^blob:/.test(url || '') ? `<img src="${esc(url)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  return `<span class="av ${cls}" style="background:linear-gradient(hsl(${hue} 60% 48%),hsl(${hue} 65% 30%))">${esc(n.charAt(0).toUpperCase())}${img}</span>`;
}
const nflTeam = id => (id && LG.nfl.teamIdx?.[String(id)]) || null;
function teamBadge(id){
  const t = nflTeam(id);
  return t ? `<a class="fteam" href="#/nfl/team/${t.id}/foro" title="Hincha de ${esc(t.displayName)}">${logo(t)}<span>${esc(t.abbreviation || '')}</span></a>` : '';
}
/* Texto del mensaje: escapado, citas [quote=usuario]…[/quote], links y saltos de línea. Sin imágenes. */
function renderBody(txt){
  let h = esc(txt);
  for(let i = 0; i < 6; i++){
    const n = h.replace(/\[quote=([A-Za-z0-9_]{1,20})\]((?:(?!\[quote=)[\s\S])*?)\[\/quote\]\n?/g, (m, u, b) => `<blockquote class="fq"><cite>${u} escribió:</cite>${b.trim()}</blockquote>`);
    if(n === h) break; h = n;
  }
  h = h.replace(/https?:\/\/[^\s<"']+/g, u => `<a href="${u}" target="_blank" rel="noopener nofollow ugc">${u}</a>`);
  return h.replace(/\n/g, '<br>');
}
function pager(base, page, total, per){
  const pages = Math.max(1, Math.ceil((total || 0) / per));
  if(pages <= 1) return '';
  let h = '<div class="pager">';
  for(let i = 1; i <= pages; i++){
    if(pages > 9 && i > 2 && i < pages - 1 && Math.abs(i - page) > 1){ if(!h.endsWith('…</span>')) h += '<span class="n">…</span>'; continue; }
    h += `<a class="btn ${i === page ? 'on' : ''}" href="${base}/${i}">${i}</a>`;
  }
  return h + '</div>';
}
function foroUserBar(){

}

  </form>`;
}
async function loadMine(sb, posts){
  Foro.mine = {};
  posts.forEach(p => Foro.cache.set(p.id, {username: p.profiles?.username || '', body: p.body}));
  if(!Foro.user || !posts.length) return;
  try{
    const {data} = await Foro.q(sb.from('reactions').select('post_id,value').eq('user_id', Foro.user.id).in('post_id', posts.map(p => p.id)));
    arr(data).forEach(r => { Foro.mine[r.post_id] = r.value; });
  }catch(e){}
}
function postHtml(p, n){
  const name = p.profiles?.username || '—';
  const mine = Foro.mine[p.id];
  return `<article class="fpost" id="p${p.id}"><div class="au">${avatar(name, p.profiles?.avatar_url)}<b>${esc(name)}</b>${teamBadge(p.profiles?.team_id)}</div>
    <div class="bd"><div class="meta"><span>${esc(fmtDate(new Date(p.created_at)))} ${esc(fmtTime(new Date(p.created_at)))} · ${esc(timeAgo(p.created_at))}</span>${n ? `<span>#${n}</span>` : ''}</div>
      <div class="tx">${renderBody(p.body)}</div>
      <div class="acts"><button class="rx up ${mine === 1 ? 'on' : ''}" onclick="App.foroReact(${p.id},1)" title="Me gusta">👍 <b>${p.likes || 0}</b></button><button class="rx dn ${mine === -1 ? 'on' : ''}" onclick="App.foroReact(${p.id},-1)" title="No me gusta">👎 <b>${p.dislikes || 0}</b></button><button class="rx" onclick="App.foroQuote(${p.id})">❝ Citar</button></div>
    </div></article>`;
}

/* Cuerpo de un foro (general o de franquicia): solapas + contenido */
async function forumBody(sb, fc, r, ctx){
  const inner = await forumInner(sb, fc, r);
  Foro.current = {fc, r: {...r}, inner};
  return `<div id="foroBox">${inner}</div>`;
}
/* Refresco del muro: reemplaza solo el contenido del foro, y solo si cambió (sin parpadeo ni saltos) */
async function refreshForoBox(){
  const cur = Foro.current, box = $('#foroBox');
  if(!cur || !box || !Foro.sb) return;
  const id = state.renderId;
  try{
    const inner = await forumInner(Foro.sb, cur.fc, cur.r);
    if(id !== state.renderId || Foro.current !== cur || inner === cur.inner) return;
    const ta = $('#foText');
    if(ta && (ta.value || document.activeElement === ta)) return;
    cur.inner = inner;
    const b = $('#foroBox'); if(b) b.innerHTML = inner;
  }catch(e){}
}
async function forumInner(sb, fc, r){
  const sub = r.fsub || 'muro';
  const rk = fc.forum === 'general';   // los rankings son globales: solo en el Foro General
  const tabs = `<div class="ftabs"><a class="tab ${sub === 'muro' ? 'on' : ''}" href="${fc.base}">💬 Mensajes</a><a class="tab ${['temas', 't', 'nuevo'].includes(sub) ? 'on' : ''}" href="${fc.base}/temas">📋 Temas</a>${rk ? `<a class="tab ${sub === 'rankings' ? 'on' : ''}" href="${fc.base}/rankings">🏆 Rankings</a>` : ''}</div>`;
  let html;
  if(sub === 'rankings' && rk) html = await foroRankings(sb, fc, r);
  else if(sub === 'temas') html = await foroTopics(sb, fc, r);
  else if(sub === 't') html = await foroThread(sb, fc, r);
  else if(sub === 'nuevo') html = foroNewTopic(fc);
  else html = await foroWall(sb, fc, r);
  return foroUserBar() + tabs + html;
}

async function foroWall(sb, fc, r){
  const page = Math.max(1, r.page || 1), from = (page - 1) * WALL_PER_PAGE;
  const {data, count} = await Foro.q(sb.from('posts').select(POST_SEL, {count: 'exact'}).eq('forum', fc.forum).is('thread_id', null).order('id', {ascending: false}).range(from, from + WALL_PER_PAGE - 1));
  const posts = arr(data);
  await loadMine(sb, posts);
  return `<div class="ph">Mensajes · ${esc(fc.name)} <span class="cnt">· ${pluralize(count || 0, 'mensaje', 'mensajes')} · se actualiza solo</span></div>
    <div class="box">${page === 1 ? composer(fc.forum, null, fc.base, 'Escribí un mensaje…') : ''}${posts.map(p => postHtml(p)).join('') || '<div class="empty"><b>Todavía no hay mensajes</b>Escribí el primero.</div>'}</div>
    ${pager(fc.base + '/muro', page, count, WALL_PER_PAGE)}`;
}

async function foroTopics(sb, fc, r){
  const page = Math.max(1, r.page || 1), from = (page - 1) * THREADS_PER_PAGE;
  const {data, count} = await Foro.q(sb.from('threads').select('id,title,last_post_at,post_count,profiles!threads_author_fkey(username,team_id)', {count: 'exact'})
    .eq('forum', fc.forum).order('last_post_at', {ascending: false}).range(from, from + THREADS_PER_PAGE - 1));
  const rows = arr(data).map(t => `<tr><td class="l"><a href="${fc.base}/t/${t.id}"><b>${esc(t.title)}</b></a><div style="font-size:10px;color:var(--muted)">por ${esc(t.profiles?.username || '—')}</div></td>
    <td>${Math.max(0, (t.post_count || 1) - 1)}</td><td class="hm">${esc(timeAgo(t.last_post_at))}</td></tr>`).join('');
  return `<div class="btnrow"><a class="btn on" href="${fc.base}/nuevo">＋ Nuevo tema</a></div>
    <div class="ph">Temas · ${esc(fc.name)} <span class="cnt">· ${pluralize(count || 0, 'tema', 'temas')}</span></div>
    <div class="box tw">${rows ? `<table class="tbl"><thead><tr><th class="l">Tema</th><th>Respuestas</th><th class="hm">Último mensaje</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty"><b>Todavía no hay temas</b>Abrí el primero.</div>'}</div>
    ${pager(fc.base + '/temas', page, count, THREADS_PER_PAGE)}`;
}

async function foroThread(sb, fc, r){
  const id = num(r.id);
  const th = id ? await Foro.q(sb.from('threads').select('id,title,forum,post_count').eq('id', id).maybeSingle()) : {data: null};
  const t = th.data;
  if(!t) return emptyBox('Ese tema no existe', `<a class="btn" href="${fc.base}/temas">Volver a los temas</a>`);
  const total = t.post_count || 0;
  const pages = Math.max(1, Math.ceil(total / POSTS_PER_PAGE));
  const page = r.page === -1 ? pages : Math.min(Math.max(1, r.page || 1), pages);
  const from = (page - 1) * POSTS_PER_PAGE;
  const {data, count} = await Foro.q(sb.from('posts').select(POST_SEL, {count: 'exact'}).eq('thread_id', id).order('id', {ascending: true}).range(from, from + POSTS_PER_PAGE - 1));
  const posts = arr(data);
  await loadMine(sb, posts);
  const base = `${fc.base}/t/${id}`;
  return `<div class="crumb"><a href="${fc.base}/temas">Temas</a> › ${esc(t.title)}</div>
    <div class="ph">${esc(t.title)} <span class="cnt">· ${pluralize(count || total, 'mensaje', 'mensajes')}</span></div>
    <div class="box">${posts.map((p, i) => postHtml(p, from + i + 1)).join('') || '<div class="empty">Sin mensajes.</div>'}</div>${pager(base, page, count || total, POSTS_PER_PAGE)}
    <div class="ph">Responder</div><div class="box">${composer(t.forum, id, base + '/-1', 'Escribí tu respuesta…')}</div>`;
}

/* Rankings: hinchas por franquicia y actividad (mensajes) por hinchada + usuarios más activos */
async function foroRankings(sb, fc, r){
  await teamsOf(LG.nfl).catch(() => {});
  const mode = r.rank === 'actividad' ? 'actividad' : 'equipos';
  const sw = `<div class="btnrow"><a class="btn ${mode === 'equipos' ? 'on' : ''}" href="${fc.base}/rankings">Por equipo</a><a class="btn ${mode === 'actividad' ? 'on' : ''}" href="${fc.base}/rankings/actividad">Por actividad</a></div>`;
  const teamCell = id => { const t = nflTeam(id) || {id, displayName: 'Equipo ' + id}; return `<a class="tmc" href="#/nfl/team/${esc(id)}/foro">${logo(t)}<span>${esc(t.displayName || tName(t))}</span></a>`; };
  const bar = (v, max, id) => { const t = nflTeam(id); const c = teamColor(t), c2 = hexOk(t?.alternateColor) || '#c7ccd4'; return `<div class="rkbar"><i style="width:${max ? Math.max(3, v / max * 100).toFixed(1) : 0}%;background:linear-gradient(90deg,${c},${c} 70%,${c2})"></i></div>`; };
  const medal = i => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
  if(mode === 'equipos'){
    const {data} = await Foro.q(sb.rpc('ranking_hinchas'));
    const counts = Object.fromEntries(arr(data).map(x => [String(x.team_id), +x.fans || 0]));
    const ids = Object.keys(LG.nfl.teamIdx || {}).length ? Object.keys(LG.nfl.teamIdx) : Object.keys(counts);
    const rows = [...new Set(ids.concat(Object.keys(counts)))].map(id => ({id, n: counts[id] || 0}))
      .sort((a, b) => b.n - a.n || (nflTeam(a.id)?.displayName || '').localeCompare(nflTeam(b.id)?.displayName || ''));
    const max = rows[0]?.n || 0, total = rows.reduce((a, x) => a + x.n, 0);
    const body = rows.map((x, i) => `<tr class="${i < 3 && x.n ? 'top' : ''}"><td class="pos">${x.n ? medal(i) : '–'}</td><td class="l">${teamCell(x.id)}</td><td class="rkn"><b>${x.n}</b></td><td class="l rkc">${bar(x.n, max, x.id)}</td></tr>`).join('');
    return sw + `<div class="ph">🏆 Hinchadas · cantidad de hinchas <span class="cnt">· ${pluralize(total, 'hincha registrado', 'hinchas registrados')}</span></div>
      <div class="box tw"><table class="tbl rk"><thead><tr><th>#</th><th class="l">Franquicia</th><th>Hinchas</th><th class="l rkc"></th></tr></thead><tbody>${body}</tbody></table></div>
      <div class="legend">Cuenta a los usuarios del foro según la franquicia elegida en su perfil. ${Foro.user ? '<a href="#/foro/perfil" onclick="App.foroBack()">Cambiar la mía</a>' : '<a href="#/foro/registro" onclick="App.foroBack()">Sumate a tu hinchada</a>'}</div>`;
  }
  const [act, usr] = await Promise.all([Foro.q(sb.rpc('ranking_actividad')), Foro.q(sb.rpc('ranking_usuarios', {p_limit: 10}))]);
  const rows = arr(act.data).map(x => ({id: String(x.team_id), posts: +x.posts || 0, autores: +x.autores || 0, likes: +x.likes || 0}));
  const max = rows[0]?.posts || 0;
  const tTeams = rows.map((x, i) => `<tr class="${i < 3 ? 'top' : ''}"><td class="pos">${medal(i)}</td><td class="l">${teamCell(x.id)}</td><td class="rkn"><b>${x.posts}</b></td><td class="hm">${x.autores}</td><td class="hm">👍 ${x.likes}</td><td class="l rkc">${bar(x.posts, max, x.id)}</td></tr>`).join('');
  const tUsers = arr(usr.data).map((u, i) => `<tr class="${i < 3 ? 'top' : ''}"><td class="pos">${medal(i)}</td><td class="l"><span class="tmc">${avatar(u.username, u.avatar_url)}<b>${esc(u.username)}</b>${teamBadge(u.team_id)}</span></td><td class="rkn"><b>${+u.posts || 0}</b></td><td>👍 ${+u.likes || 0}</td></tr>`).join('');
  return sw + `<div class="ph">🔥 Hinchada más activa · mensajes escritos</div>
    <div class="box tw">${tTeams ? `<table class="tbl rk"><thead><tr><th>#</th><th class="l">Franquicia</th><th>Mensajes</th><th class="hm">Hinchas activos</th><th class="hm">Likes</th><th class="l rkc"></th></tr></thead><tbody>${tTeams}</tbody></table>` : '<div class="empty"><b>Todavía no hay actividad</b>Cuando los hinchas escriban, su equipo aparece acá.</div>'}</div>
    <div class="ph">⭐ Usuarios más activos</div>
    <div class="box tw">${tUsers ? `<table class="tbl rk"><thead><tr><th>#</th><th class="l">Usuario</th><th>Mensajes</th><th>Likes</th></tr></thead><tbody>${tUsers}</tbody></table>` : '<div class="empty">Todavía nadie escribió.</div>'}</div>
    <div class="legend">Suma los mensajes del muro y de los temas de todos los foros. Los likes son los 👍 recibidos.</div>`;
}

/* Recorta al centro, achica y convierte a JPEG (la foto pesa pocos KB) */
function squareJpeg(file, size){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
      x.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('No se pudo procesar la imagen.')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}
function alertBox(txt){
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = txt;
  document.body.appendChild(d); setTimeout(() => d.remove(), 3500);

function parseForoRest(p){

  if(s === 'nuevo') return {fsub: 'nuevo'};

  if(s === 'rankings') return {fsub: 'rankings', rank: p[1] === 'actividad' ? 'actividad' : 'equipos'};
  return {fsub: 'muro', page: 1};
}

/* =========================================================================
   BUSCADOR (equipos locales + jugadores vía ESPN search)
   ========================================================================= */
const Search = {
  items: [], sel: -1,
  async run(q){
    const box = $('#qres');
    q = q.trim();
    if(q.length < 2){ box.classList.remove('on'); return; }
    box.innerHTML = spinner('', true); box.classList.add('on');
    const nq = norm(q);
    const teamsP = Promise.all(visible().map(lg => teamsOf(lg).then(ts => ts.map(t => ({lg, t})), () => []))).then(x => { const seen = new Set(); return x.flat().filter(({lg, t}) => { const k = lg.slug + ':' + t.id; if(seen.has(k)) return false; seen.add(k); return true; }); });
    const playersP = API.get(`${SEARCH}?query=${encodeURIComponent(q)}&limit=20`).then(parseSearch).catch(() => null);
    const [teams, players] = await Promise.all([teamsP, playersP]);
    if($('#q').value.trim() !== q) return;
    const tm = teams.filter(({t}) => [t.displayName, t.abbreviation, t.location, t.name, t.nickname, t.shortDisplayName].some(s => norm(s).includes(nq)))
      .sort((a, b) => (norm(a.t.displayName).startsWith(nq) ? 0 : 1) - (norm(b.t.displayName).startsWith(nq) ? 0 : 1) || LEAGUES.indexOf(a.lg) - LEAGUES.indexOf(b.lg))
      .slice(0, 8);
    this.items = [];
    let html = '';
    if(tm.length){
      html += '<div class="qr-h">Equipos</div>';
      html += tm.map(({lg, t}) => { this.items.push(`#/${lg.key}/team/${t.id}`); return `<a class="qr" href="#/${lg.key}/team/${t.id}">${logo(t)}<span>${esc(t.displayName)}<small>${esc(lg.name)}</small></span></a>`; }).join('');
    }
    if(players && players.length){
      html += '<div class="qr-h">Jugadores</div>';
      html += players.slice(0, 10).map(p => { this.items.push(`#/${p.lg}/player/${p.id}`); return `<a class="qr" href="#/${p.lg}/player/${p.id}">${headshot(p.img, 'hs', p.name)}<span>${esc(p.name)}<small>${esc(p.sub || LG[p.lg].name)}</small></span></a>`; }).join('');
    }
    if(!html) html = `<div class="qr-empty">Sin resultados para “${esc(q)}”.${players === null ? '<br>(La búsqueda de jugadores de ESPN no respondió.)' : ''}</div>`;
    else if(players === null) html += '<div class="qr-empty">La búsqueda de jugadores de ESPN no respondió.</div>';
    box.innerHTML = html; this.sel = -1;
  },
};
function parseSearch(d){
  const out = [], seen = new Set();
  const visit = x => {
    if(!x || typeof x !== 'object') return;
    if(Array.isArray(x)) return x.forEach(visit);
    const uid = String(x.uid || '');
    const web = String(x.link?.web || x.links?.web?.href || x.href || '');
    const m = uid.match(/~a:(\d+)/) || web.match(/\/player\/_\/id\/(\d+)/);
    const isFb = /^s:20~/.test(uid) || /\/(nfl|college-football|cfl|ufl)\//.test(web) || /football/i.test(x.sport || x.defaultLeagueSlug || '');
    if(m && isFb && (x.type ? /player|athlete/i.test(x.type) : true)){
      const id = m[1];
      let lg = 'nfl';
      if(/~l:23~/.test(uid) || /college-football/.test(web) || /college-football/.test(x.defaultLeagueSlug || '')) lg = 'fbs';
      else if(/\/cfl\//.test(web) || /cfl/.test(x.defaultLeagueSlug || '')) lg = 'cfl';
      else if(/\/ufl\//.test(web) || /ufl/.test(x.defaultLeagueSlug || '')) lg = 'ufl';
      if(!seen.has(lg + id) && LG[lg].ok !== false){ seen.add(lg + id); out.push({id, lg, name: x.displayName || x.name || x.title || 'Jugador', sub: x.subtitle || x.description || '', img: x.image?.default || x.image?.href || arr(x.images)[0]?.url || ''}); }
      return;
    }
    for(const k of ['results', 'contents', 'items', 'data']) if(x[k]) visit(x[k]);
  };
  visit(d);
  return out;
}

  q.addEventListener('keydown', e => {
    const links = [...qres.querySelectorAll('.qr')];
    if(e.key === 'Escape'){ qres.classList.remove('on'); q.blur(); }
    else if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); if(!links.length) return;
      Search.sel = (Search.sel + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
      links.forEach((l, i) => l.classList.toggle('sel', i === Search.sel));
    } else if(e.key === 'Enter'){
      const target = links[Search.sel >= 0 ? Search.sel : 0];
      if(target){ location.hash = target.getAttribute('href'); qres.classList.remove('on'); q.blur(); }
    }
  });
  qres.addEventListener('click', e => { if(e.target.closest('.qr')){ qres.classList.remove('on'); q.value = ''; } });

  // Auto-refresh cada 30s sólo si hay partidos en vivo en la vista actual
  const typing = () => { const ta = $('#foText'); return !!ta && (!!ta.value || document.activeElement === ta); };
  setInterval(() => { if(state.liveInView && !document.hidden && !typing() && !$('#foEmo:not([hidden])')) route(true); }, 30e3);
  // Muro del foro: se actualiza solo cada 20 s (si no estás escribiendo)
  setInterval(() => {
    const r = state.route;
    const wall = (r.view === 'foro' && !r.acct || r.view === 'team' && r.tab === 'foro' || (r.view === 'game' || r.view === 'day' && !r.lg) && !state.liveInView) && r.fsub === 'muro' && (r.page || 1) === 1 && $('#foroBox');
    if(wall && Foro.sb && !document.hidden && !typing() && !$('#foEmo:not([hidden])')) refreshForoBox();
  }, 20e3);
  // Ticker: 30s si hay algo en vivo, si no cada 5 min
  let tick = 0;
  setInterval(() => {
    tick++;
    const anyLive = visible().some(lg => arr(lg.probe?.events).some(e => arr(e.competitions)[0]?.status?.type?.state === 'in'));
    if(!document.hidden && (anyLive || tick % 10 === 0)) refreshTicker();
  }, 30e3);
  route();
  // Notificaciones: restaurar sesión del foro y chequear cada 60 s
  if(Foro.configured()) Foro.client().then(() => Notif.refresh()).catch(() => {});
  setInterval(() => { if(Foro.user && !document.hidden) Notif.refresh(); }, 60e3);
  document.addEventListener('visibilitychange', () => { if(!document.hidden && Foro.user && Date.now() - Notif.last > 20e3) Notif.refresh(); });
  document.addEventListener('click', e => { if(!e.target.closest('#notif')) App.notifClose(); });
}
init();
</script>
</body>
</html>
